<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام إدارة همسة للسياحة</title>
</head>
<body>
<div id="app-root"></div>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');

  :root{
    --navy-900:#0c1f3d;
    --navy-800:#14315c;
    --navy-700:#1b3a6b;
    --navy-600:#25508f;
    --gold-500:#f2b705;
    --gold-600:#c99a03;
    --sand-50:#faf7f0;
    --sand-100:#f1ead8;
    --ink:#14213d;
    --line:#e3ddce;
    --muted:#6b7280;
    --danger:#b3261e;
    --success:#1a7a4c;
    --warn:#a5690a;
  }
  *{box-sizing:border-box;}
  #app-root, #app-root *{font-family:'Cairo',sans-serif;}
  #app-root{direction:rtl;color:var(--ink);background:var(--sand-50);min-height:100vh;}
  #app-root button{font-family:inherit;cursor:pointer;border:none;}
  #app-root input, #app-root select, #app-root textarea{font-family:inherit;}

  /* ---------- Login ---------- */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 30% 20%, var(--navy-700), var(--navy-900) 65%);
    padding:24px;}
  .login-card{background:#fff;border-radius:20px;width:100%;max-width:400px;overflow:hidden;
    box-shadow:0 30px 60px rgba(12,31,61,.35);position:relative;}
  .arch-top{height:110px;background:linear-gradient(160deg,var(--navy-700),var(--navy-900));
    position:relative;display:flex;align-items:center;justify-content:center;}
  .arch-top::after{content:"";position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);
    width:120px;height:60px;background:#fff;border-radius:60px 60px 0 0;}
  .arch-top img{height:56px;position:relative;z-index:2;margin-top:-10px;filter:brightness(0) invert(1);}
  .login-body{padding:38px 32px 32px;}
  .login-body h1{font-size:20px;font-weight:800;margin:0 0 4px;color:var(--navy-900);text-align:center;}
  .login-body p.sub{text-align:center;color:var(--muted);font-size:13px;margin:0 0 26px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--navy-800);}
  .field input, .field select, .field textarea{width:100%;padding:11px 14px;border:1.5px solid var(--line);
    border-radius:10px;font-size:14px;background:var(--sand-50);transition:.15s;}
  .field input:focus, .field select:focus, .field textarea:focus{outline:none;border-color:var(--gold-500);
    background:#fff;}
  .btn-primary{width:100%;padding:12px;background:var(--navy-800);color:#fff;border-radius:10px;
    font-weight:700;font-size:15px;transition:.15s;}
  .btn-primary:hover{background:var(--navy-900);}
  .btn-gold{background:var(--gold-500);color:var(--navy-900);}
  .btn-gold:hover{background:var(--gold-600);}
  .error-box{background:#fdeceb;color:var(--danger);padding:10px 14px;border-radius:8px;font-size:13px;
    margin-bottom:16px;text-align:center;}
  .demo-box{margin-top:22px;background:var(--sand-100);border-radius:10px;padding:12px 14px;font-size:11.5px;
    color:var(--navy-800);line-height:1.9;}
  .demo-box b{color:var(--navy-900);}

  /* ---------- Shell ---------- */
  .shell{display:flex;min-height:100vh;}
  .sidebar{width:250px;background:linear-gradient(180deg,var(--navy-900),var(--navy-800));color:#fff;
    display:flex;flex-direction:column;flex-shrink:0;}
  .sidebar-head{padding:22px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.1);}
  .sidebar-head img{height:34px;filter:brightness(0) invert(1);}
  .sidebar-head span{font-weight:800;font-size:15px;}
  .nav{flex:1;overflow-y:auto;padding:14px 10px;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;color:#dfe6f2;
    font-size:14px;font-weight:600;margin-bottom:4px;transition:.15s;background:transparent;width:100%;text-align:right;}
  .nav-item:hover{background:rgba(255,255,255,.08);}
  .nav-item.active{background:var(--gold-500);color:var(--navy-900);}
  .sidebar-foot{padding:16px;border-top:1px solid rgba(255,255,255,.1);}
  .user-chip{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--gold-500);color:var(--navy-900);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0;}
  .user-chip div .name{font-size:13px;font-weight:700;}
  .user-chip div .role{font-size:11px;color:#b9c4da;}
  .logout-btn{width:100%;padding:9px;background:rgba(255,255,255,.08);color:#fff;border-radius:8px;font-size:13px;font-weight:600;}
  .logout-btn:hover{background:rgba(255,255,255,.16);}

  .main{flex:1;min-width:0;padding:26px 30px;overflow-y:auto;}
  .page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
  .page-head h2{font-size:22px;font-weight:800;color:var(--navy-900);margin:0;display:flex;align-items:center;gap:10px;}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:24px;}
  .stat-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;position:relative;overflow:hidden;}
  .stat-card::before{content:"";position:absolute;top:0;right:0;width:5px;height:100%;background:var(--gold-500);}
  .stat-card .num{font-size:26px;font-weight:800;color:var(--navy-900);}
  .stat-card .lbl{font-size:12.5px;color:var(--muted);margin-top:4px;}

  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:20px;}
  .card h3{margin:0 0 14px;font-size:15px;font-weight:800;color:var(--navy-900);}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{text-align:right;padding:10px 12px;color:var(--navy-800);font-weight:700;border-bottom:2px solid var(--sand-100);
    background:var(--sand-50);white-space:nowrap;}
  tbody td{padding:10px 12px;border-bottom:1px solid var(--sand-100);vertical-align:middle;}
  tbody tr:hover{background:var(--sand-50);}
  .table-wrap{overflow-x:auto;}
  .row-photo{width:32px;height:32px;border-radius:50%;object-fit:cover;background:var(--sand-100);}
  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700;}
  .badge.gray{background:#eef0f3;color:#555;}
  .badge.green{background:#e5f5ec;color:var(--success);}
  .badge.red{background:#fdeceb;color:var(--danger);}
  .badge.gold{background:#fff3d1;color:var(--warn);}
  .badge.blue{background:#e6eefc;color:var(--navy-700);}

  .icon-btn{background:transparent;color:var(--navy-700);font-size:13px;padding:5px 8px;border-radius:6px;}
  .icon-btn:hover{background:var(--sand-100);}
  .icon-btn.del{color:var(--danger);}

  .empty-state{text-align:center;padding:40px 20px;color:var(--muted);}
  .empty-state .big{font-size:34px;margin-bottom:8px;}

  /* modal */
  .modal-bg{position:fixed;inset:0;background:rgba(12,20,38,.55);display:flex;align-items:center;justify-content:center;
    z-index:50;padding:20px;}
  .modal{background:#fff;border-radius:16px;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;padding:26px;}
  .modal h3{margin:0 0 18px;font-size:17px;font-weight:800;color:var(--navy-900);}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .form-grid .full{grid-column:1/-1;}
  .modal-actions{display:flex;gap:10px;margin-top:20px;}
  .btn-secondary{flex:1;padding:11px;background:var(--sand-100);color:var(--navy-800);border-radius:10px;font-weight:700;font-size:14px;}
  .btn-secondary:hover{background:var(--line);}
  .modal-actions .btn-primary{flex:1;}
  .photo-preview{width:64px;height:64px;border-radius:50%;object-fit:cover;background:var(--sand-100);margin-bottom:8px;display:block;}

  .areas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
  .area-chip{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center;}
  .area-chip .cnt{font-size:20px;font-weight:800;color:var(--navy-800);}
  .area-chip .nm{font-size:12.5px;color:var(--muted);margin-top:3px;}

  .split-two{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  @media (max-width:900px){.split-two{grid-template-columns:1fr;} .form-grid{grid-template-columns:1fr;}}
  @media (max-width:760px){.sidebar{position:fixed;right:0;top:0;bottom:0;z-index:40;transform:translateX(100%);transition:.2s;}
    .sidebar.open{transform:translateX(0);} .main{padding:18px;} .menu-toggle{display:inline-flex !important;}}
  .menu-toggle{display:none;background:var(--navy-900);color:#fff;padding:8px 10px;border-radius:8px;font-size:16px;}
  .assumption-note{background:#fff3d1;border:1px solid #f0d98a;color:var(--warn);font-size:12px;padding:10px 14px;
    border-radius:10px;margin-bottom:18px;}

  /* ---------------- Analytics / لوحات تحليل البيانات ---------------- */
  .board-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
  .board-tab{padding:9px 16px;border-radius:20px;background:#fff;border:1.5px solid var(--line);color:var(--navy-800);
    font-size:13px;font-weight:700;}
  .board-tab.active{background:var(--navy-800);color:#fff;border-color:var(--navy-800);}
  .analytics-filterbar{display:flex;gap:10px;flex-wrap:wrap;flex:1;}
  .analytics-filter{padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:13px;background:#fff;
    color:var(--navy-800);min-width:140px;}
  .widgets-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;}
  .widget-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;text-align:right;}
  .widget-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px;}
  .widget-head h4{margin:0;font-size:14px;font-weight:800;color:var(--navy-900);}
  .add-widget-card{display:flex;align-items:center;justify-content:center;flex-direction:column;background:var(--sand-100);
    border:1.5px dashed var(--gold-500);color:var(--gold-600);font-weight:700;font-size:13.5px;min-height:120px;
    text-align:center;line-height:1.9;}
  .add-widget-card:hover{background:#fff3d1;}
  .pie-wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
  .pie-donut-wrap{position:relative;width:120px;height:120px;flex-shrink:0;}
  .pie-donut{width:100%;height:100%;border-radius:50%;}
  .pie-hole{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:56px;height:56px;
    border-radius:50%;background:#fff;}
  .pie-legend{flex:1;min-width:140px;}
  .legend-row{display:flex;align-items:center;gap:8px;font-size:12.5px;margin-bottom:6px;}
  .legend-row .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  .legend-row .legend-lbl{flex:1;color:var(--ink);}
  .legend-row .legend-val{color:var(--muted);font-weight:700;white-space:nowrap;}
  .bar-wrap{display:flex;flex-direction:column;gap:10px;}
  .bar-row{display:flex;align-items:center;gap:10px;font-size:12.5px;}
  .bar-lbl{width:90px;flex-shrink:0;color:var(--navy-800);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bar-track{flex:1;height:16px;background:var(--sand-100);border-radius:8px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:8px;}
  .bar-val{width:34px;text-align:left;font-weight:700;color:var(--navy-900);}
  .stat-number{font-size:44px;font-weight:800;color:var(--navy-900);text-align:center;padding:20px 0;}
  .empty-mini{color:var(--muted);font-size:12.5px;text-align:center;padding:20px 0;}

  /* ---------------- الإسكان (Trips -> Hotels -> Rooms -> Guests) ---------------- */
  .crumbs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:16px;font-size:13px;color:var(--navy-800);}
  .crumbs button{background:transparent;color:var(--navy-700);font-weight:700;padding:4px 8px;border-radius:6px;}
  .crumbs button:hover{background:var(--sand-100);}
  .crumbs .sep{color:var(--muted);}
  .click-card{cursor:pointer;transition:.15s;}
  .click-card:hover{box-shadow:0 6px 16px rgba(12,31,61,.12);transform:translateY(-2px);}
  .progress-track{height:8px;background:var(--sand-100);border-radius:6px;overflow:hidden;margin-top:8px;}
  .progress-fill{height:100%;border-radius:6px;background:var(--navy-600);}

  /* ---------------- شيت البيانات القابل للتعديل المباشر ---------------- */
  .cell-input{width:100%;padding:6px 8px;border:1px solid transparent;border-radius:6px;background:transparent;font-size:13px;}
  .cell-input:hover{border-color:var(--line);}
  .cell-input:focus{outline:none;border-color:var(--gold-500);background:#fff;}
  .sheet-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
  .sheet-toolbar a.icon-btn{text-decoration:none;display:inline-flex;align-items:center;}
  /* ---------------- PR team hierarchy ---------------- */
  .pr-team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;}
  .pr-team-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;cursor:pointer;transition:.15s;}
  .pr-team-card:hover{box-shadow:0 8px 20px rgba(12,31,61,.12);transform:translateY(-2px);}
  .pr-team-card .team-title{font-size:16px;font-weight:800;color:var(--navy-900);margin-bottom:8px;}
  .pr-team-card .team-meta{font-size:12px;color:var(--muted);line-height:1.8;}
  .member-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;}
  .member-card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px;cursor:pointer;}
  .member-card:hover{box-shadow:0 7px 18px rgba(12,31,61,.11);}
  .member-card .member-name{font-weight:800;color:var(--navy-900);font-size:15px;}
  .member-card .member-role{font-size:11.5px;color:var(--muted);margin-top:3px;}
  .member-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px;}
  .member-stat{background:var(--sand-50);border-radius:9px;padding:8px;text-align:center;}
  .member-stat b{display:block;font-size:16px;color:var(--navy-800);}
  .member-stat span{font-size:10px;color:var(--muted);}
  .detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;}
  .detail-item{background:var(--sand-50);border-radius:10px;padding:11px;}
  .detail-item .k{font-size:11px;color:var(--muted);margin-bottom:3px;}
  .detail-item .v{font-size:13px;font-weight:700;word-break:break-word;}
  .link-box{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;}
  .link-box a{color:var(--navy-700);font-weight:700;text-decoration:none;}
</style>

  /* ---------------- Google Sheets backend ---------------- */
  const GOOGLE_SHEETS_WEBHOOK = 'https://script.google.com/macros/s/AKfycbw7Cnm2cgOiB_6MJ2DJYP8NsLaNDXtbaJKRrLiri4LizkMr7s1Q8-AOzRX8uEg5t_pr/exec';
  let HOMSA_SESSION = localStorage.getItem('homsa_session_token') || '';

  async function sheetRequest(action, table, payload){
    if(!GOOGLE_SHEETS_WEBHOOK) throw new Error('رابط Google Sheets غير مضبوط');
    if(!HOMSA_SESSION) throw new Error('انتهت جلسة الدخول — سجّل الدخول مرة أخرى');
    if(action==='list'){
      const u = new URL(GOOGLE_SHEETS_WEBHOOK);
      u.searchParams.set('action','list');
      u.searchParams.set('table',table);
      u.searchParams.set('session',HOMSA_SESSION);
      const r=await fetch(u.toString(),{cache:'no-store'});
      const data=await r.json();
      if(!data.ok) {
        if(data.error==='Unauthorized'){ HOMSA_SESSION=''; localStorage.removeItem('homsa_session_token'); }
        throw new Error(data.error||'فشل تحميل البيانات من Google Sheets');
      }
      return data.rows||[];
    }
    const r=await fetch(GOOGLE_SHEETS_WEBHOOK,{method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action,table,payload,session:HOMSA_SESSION,at:new Date().toISOString()}),
      keepalive:true});
    const data=await r.json().catch(()=>({ok:true}));
    if(!data.ok) throw new Error(data.error||'فشل حفظ البيانات في Google Sheets');
    return data;
  }

  /* ---------------- Storage helpers ---------------- */
  async function loadList(key){
    try{ return await sheetRequest('list',key); }
    catch(e){ console.error('Google Sheets load error', key, e); return []; }
  }

  async function apiAdd(table, record){
    if(!record.id) record.id=uid();
    await sheetRequest('upsert',table,record);
    return record;
  }

  async function apiUpdate(table, record){
    await sheetRequest('upsert',table,record);
  }

  async function apiDelete(table, id){
    await sheetRequest('delete',table,{id});
  }

  const cache = {};
  async function getData(key){ if(!cache[key]) cache[key] = await loadList(key); return cache[key]; }
  function invalidate(key){ cache[key] = null; }

  /* ---------------- App state ---------------- */
  let state = { user:null, view:'dashboard', sidebarOpen:false, modal:null };

  const root = document.getElementById('app-root');

  function uid(){ return 'id'+Math.random().toString(36).slice(2,10); }
  function esc(s){ return (s===undefined||s===null)?'':String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }


  /* ---------------- PR access control ---------------- */
  function isPRUser(){ return ['pr_manager','pr_leader','pr_member'].includes(state.user?.role); }
  function currentEmployee(){
    if(!state.user) return null;
    const list = cache.employees || [];
    return list.find(e => (e.username && state.user.username && String(e.username).toLowerCase()===String(state.user.username).toLowerCase())
      || e.id===state.user.employeeId) || null;
  }
  async function currentEmployeeFresh(){
    const emps=await getData('employees');
    return emps.find(e => (e.username && state.user.username && String(e.username).toLowerCase()===String(state.user.username).toLowerCase())
      || e.id===state.user.employeeId) || null;
  }
  async function prTeamName(){
    const emp=await currentEmployeeFresh();
    return emp?.team || state.user?.team || '';
  }
  async function prTeamMembers(){
    const emps=await getData('employees');
    if(state.user.role==='pr_manager') return emps.filter(e=>e.status!=='inactive');
    const team=await prTeamName();
    return emps.filter(e=>e.status!=='inactive' && e.team===team);
  }
  async function prAllowedNames(){
    const members=await prTeamMembers();
    return new Set(members.map(e=>e.name).filter(Boolean));
  }
  async function filterPRData(key,data){
    if(!isPRUser()) return data;
    if(state.user.role==='pr_manager') return data;
    const emp=await currentEmployeeFresh();
    const myName=emp?.name || state.user.name;
    const teamNames=await prAllowedNames();
    if(key==='employees') return data.filter(r=>teamNames.has(r.name));
    if(key==='teams') {
      const team=await prTeamName();
      return data.filter(r=>r.name===team);
    }
    if(key==='indoor_leads' || key==='indoor_data' || key==='subscriptions'){
      return data.filter(r=>teamNames.has(r.responsiblePerson) && (state.user.role==='pr_leader' || r.responsiblePerson===myName));
    }
    if(key==='pr_member_data'){
      return data.filter(r=>teamNames.has(r.memberId) && (state.user.role==='pr_leader' || r.memberId===myName));
    }
    return data;
  }
  function prCanEditRow(key,row){
    if(!isPRUser()) return true;
    if(state.user.role==='pr_manager') return true;
    const myName = currentEmployee()?.name || state.user.name;
    if(state.user.role==='pr_leader'){
      if(['indoor_leads','indoor_data','subscriptions'].includes(key)) return true;
      if(key==='pr_member_data') return true;
      return false;
    }
    if(key==='indoor_leads' || key==='indoor_data' || key==='subscriptions') return !row?.id || row.responsiblePerson===myName;
    if(key==='pr_member_data') return !row?.id || row.memberId===myName;
    return key==='employees' && row?.name===myName;
  }
  async function maybeCreateSubscriptionFromLead(lead){
    if(lead.type!=='مهتم' || lead.status!=='مشترك') return;
    const subs=await getData('subscriptions');
    if(subs.some(s=>String(s.leadId||'')===String(lead.id))) return;
    const sub={
      id:uid(), leadId:lead.id, customerName:lead.name||'', phone:lead.phone||'',
      responsiblePerson:lead.responsiblePerson||'', subscriptionDate:new Date().toISOString().slice(0,10),
      packageType:'', subscriptionStatus:'نشط', notes:lead.notes||''
    };
    await apiAdd('subscriptions',sub);
    invalidate('subscriptions');
  }

    const header = `
      <div class="page-head">

        return {c, totalDebit, totalCredit, balance};

        <div class="stat-grid">

          <div class="stat-card"><div class="num">${money_(grandDebit-grandCredit)}</div><div class="lbl">صافي المتبقي على العملاء</div></div>
        </div>
        <div class="card">
          ${rows.length? `<div class="table-wrap"><table>
            <thead><tr><th>العميل</th><th>إجمالي مدين</th><th>إجمالي دائن</th><th>الرصيد</th><th></th></tr></thead>

              <td><button class="icon-btn" data-open="${esc(r.c)}">عرض كشف الحساب ↗</button></td>

          </table></div>` : `<div class="empty-state"><div class="big">📭</div>لا توجد قيود بعد — ابدأ بإضافة قيد</div>`}

    } else {
      const list = entries.filter(e=>e.clientName===sel).sort((a,b)=>(a.date||'').localeCompare(b.date||''));

          <td>${esc(e.date)}</td><td>${esc(e.description)}</td><td>${esc(e.packageType)}</td>

        </tr>`;
      }).join('');
      const totalDebit = list.reduce((s,e)=>s+num_(e.debit),0);
      const totalCredit = list.reduce((s,e)=>s+num_(e.credit),0);
      page.innerHTML = header + `
        <button class="icon-btn" id="back-to-clients" style="margin-bottom:14px;">→ رجوع لكل العملاء</button>
        <div class="stat-grid">
          <div class="stat-card"><div class="num">${money_(totalDebit)}</div><div class="lbl">إجمالي المدين</div></div>
          <div class="stat-card"><div class="num">${money_(totalCredit)}</div><div class="lbl">إجمالي الدائن</div></div>

  async function openLedgerForm(id, presetClient){
    const list = await getData('accounting');
    const row = id? list.find(r=>r.id===id) : (presetClient? {clientName:presetClient}: {});
    const modalBg = document.createElement('div');
    modalBg.className = 'modal-bg';
    modalBg.innerHTML = `<div class="modal">
      <h3>${id? 'تعديل قيد':'إضافة قيد جديد'} — كشف الحساب</h3>
      <form id="ledger-form"><div class="form-grid">
        ${LEDGER_FIELDS.map(f=>renderField(f, row, {})).join('')}
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="cancel-btn">إلغاء</button>
        <button type="submit" class="btn-primary btn-gold">حفظ</button>
      </div></form>
    </div>`;
    document.body.appendChild(modalBg);
    modalBg.querySelector('#cancel-btn').addEventListener('click', ()=>modalBg.remove());
    modalBg.addEventListener('click', e=>{ if(e.target===modalBg) modalBg.remove(); });
    modalBg.querySelector('#ledger-form').addEventListener('submit', async e=>{
      e.preventDefault();
      const isNew = !row.id;
      const newRow = row.id? {...row} : {id: uid()};
      LEDGER_FIELDS.forEach(f=>{ newRow[f.key] = modalBg.querySelector(`[name="${f.key}"]`).value; });
      if(isNew) await apiAdd('accounting', newRow); else await apiUpdate('accounting', newRow);
      invalidate('accounting');
      state.ledgerClient = newRow.clientName;
      modalBg.remove();
      render();
    });
  }

  /* ================================================================
     Analytics — لوحات تحليل بيانات قابلة للتخصيص لكل قسم
     كل قسم عنده امكانية يعمل "لوحة" مرتبطة بمصدر بيانات (أي موديول)،
     ويضيف فيها عناصر تحليل (دائري / أعمدة / جدول / رقم) بنفسه، ويقدر
     كمان يقسّم أي عنصر حسب "الفريق" لو الحقل مرتبط بموظف.
     مسؤول تحليل البيانات (analyst) شايف كل الأقسام بدون استثناء.
     ================================================================ */
  const CHART_COLORS = ['#b3261e','#f2b705','#1a7a4c','#25508f','#a5690a','#6b7280',
    '#8b5cf6','#0891b2','#dc2626','#059669','#d97706','#0284c7'];

  function moduleDimensionOptions(mod){
    const opts = [];
    mod.fields.forEach(f=>{
      if(f.type==='select' || f.type==='dynamicSelect'){
        opts.push({key:f.key, label:f.label});
        if(f.type==='dynamicSelect' && f.ref==='employees'){
          opts.push({key:f.key+'__team', label:f.label+' — الفريق'});
        }
      }
    });
    return opts;
  }
  function moduleMetricFields(mod){ return mod.fields.filter(f=>f.type==='number'); }
  function moduleFilterFields(mod){ return mod.fields.filter(f=>f.type==='select' || f.type==='dynamicSelect'); }

  async function employeeTeamMap(){
    const emps = await getData('employees');
    const map = {};
    emps.forEach(e=>{ if(e.name) map[e.name] = e.team || 'بدون فريق'; });
    return map;
  }

  function dimValue(row, dimKey, teamMap){
    if(dimKey.endsWith('__team')){
      const base = dimKey.slice(0, -('__team'.length));
      const person = row[base];
      return (person && teamMap[person]) || 'بدون فريق';
    }
    return row[dimKey] || 'غير محدد';
  }

  function groupAndAggregate(rows, dimKey, metric, metricField, teamMap){
    if(!dimKey){
      const total = metric==='sum'? rows.reduce((s,r)=>s+num_(r[metricField]),0) : rows.length;
      return [{label:'الإجمالي', value: total}];
    }
    const map = {};
    rows.forEach(r=>{
      const g = dimValue(r, dimKey, teamMap);
      if(!(g in map)) map[g]=0;
      map[g] += (metric==='sum') ? num_(r[metricField]) : 1;
    });
    return Object.entries(map).map(([k,v])=>({label:k, value:v})).sort((a,b)=>b.value-a.value);
  }

  function renderPieWidget(entries){
    const total = entries.reduce((s,e)=>s+e.value,0) || 1;
    let acc = 0;
    const stops = entries.map((e,i)=>{
      const start = acc/total*360; acc += e.value; const end = acc/total*360;
      return `${CHART_COLORS[i % CHART_COLORS.length]} ${start}deg ${end}deg`;
    }).join(', ');
    const legend = entries.map((e,i)=>{
      const pct = Math.round(e.value/total*1000)/10;
      return `<div class="legend-row"><span class="dot" style="background:${CHART_COLORS[i % CHART_COLORS.length]}"></span>
        <span class="legend-lbl">${esc(e.label)}</span><span class="legend-val">${e.value} (${pct}%)</span></div>`;
    }).join('');
    return `<div class="pie-wrap">
      <div class="pie-donut-wrap"><div class="pie-donut" style="background:conic-gradient(${entries.length?stops:'#eee 0deg 360deg'});"></div><div class="pie-hole"></div></div>
      <div class="pie-legend">${legend || '<div class="empty-mini">لا توجد بيانات</div>'}</div>
    </div>`;
  }

  function renderBarWidget(entries){
    if(!entries.length) return '<div class="empty-mini">لا توجد بيانات</div>';
    const max = Math.max(1, ...entries.map(e=>e.value));
    return `<div class="bar-wrap">${entries.map((e,i)=>{
      const pct = Math.round(e.value/max*100);
      return `<div class="bar-row"><div class="bar-lbl">${esc(e.label)}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${CHART_COLORS[i % CHART_COLORS.length]};"></div></div>
        <span class="bar-val">${e.value}</span></div>`;
    }).join('')}</div>`;
  }

  function renderTableWidget(entries){
    return `<div class="table-wrap"><table><thead><tr><th>الفئة</th><th>القيمة</th></tr></thead>
      <tbody>${entries.length? entries.map(e=>`<tr><td>${esc(e.label)}</td><td><b>${e.value}</b></td></tr>`).join('') :
      `<tr><td colspan="2" style="text-align:center;color:var(--muted);">لا توجد بيانات</td></tr>`}</tbody></table></div>`;
  }

  function renderNumberWidget(entries){
    const total = entries.reduce((s,e)=>s+e.value,0);
    return `<div class="stat-number">${total.toLocaleString('ar-EG')}</div>`;
  }

  function renderWidgetBody(chartType, entries){
    if(chartType==='pie') return renderPieWidget(entries);
    if(chartType==='bar') return renderBarWidget(entries);
    if(chartType==='table') return renderTableWidget(entries);
    return renderNumberWidget(entries);
  }

  async function renderAnalytics(page, mods){
    const accessibleKeys = new Set(mods.map(([k])=>k));
    const allBoards = await getData('dashboards');
    const myBoards = allBoards.filter(b=> accessibleKeys.has(b.sourceModule));
    if(!state.analyticsBoard || !myBoards.find(b=>b.id===state.analyticsBoard)){
      state.analyticsBoard = myBoards.length? myBoards[0].id : null;
    }
    const board = myBoards.find(b=>b.id===state.analyticsBoard) || null;
    state.analyticsFilters = state.analyticsFilters || {};

    let bodyHtml, mod, widgets;
    if(!board){
      bodyHtml = `<div class="card"><div class="empty-state"><div class="big">📊</div>لا توجد لوحات تحليل بعد — اضغط "+ لوحة جديدة" لبدء بناء التحليلات الخاصة بقسمك</div></div>`;
    } else {
      mod = MODULES[board.sourceModule];
      const rawData = await getData(board.sourceModule);
      const teamMap = await employeeTeamMap();
      const filterFields = moduleFilterFields(mod);
      const filtersHtml = filterFields.map(f=>{
        const options = f.type==='select'? f.options : [...new Set(rawData.map(r=>r[f.key]).filter(Boolean))];
        const cur = state.analyticsFilters[f.key] || '';
        return `<select class="analytics-filter" data-field="${f.key}">
          <option value="">${esc(f.label)}: الكل</option>
          ${options.map(o=>`<option value="${esc(o)}" ${o===cur?'selected':''}>${esc(o)}</option>`).join('')}
        </select>`;
      }).join('');

      const filteredData = rawData.filter(r=> filterFields.every(f=>{
        const v = state.analyticsFilters[f.key]; return !v || r[f.key]===v;
      }));

      widgets = (await getData('widgets')).filter(w=>w.dashboardId===board.id);
      const widgetCards = widgets.map(w=>{
        const entries = groupAndAggregate(filteredData, w.groupBy, w.metric, w.metricField, teamMap);
        return `<div class="widget-card">
          <div class="widget-head"><h4>${esc(w.title)}</h4>
            <div><button class="icon-btn" data-editw="${w.id}">✏️</button><button class="icon-btn del" data-delw="${w.id}">🗑️</button></div>
          </div>
          ${renderWidgetBody(w.chartType, entries)}
        </div>`;
      }).join('');

      bodyHtml = `
        <div class="page-head" style="margin-bottom:14px;">
          <div class="analytics-filterbar">${filtersHtml || '<span style="color:var(--muted);font-size:13px;">لا توجد فلاتر متاحة لهذا المصدر</span>'}</div>
          <div style="display:flex;gap:8px;">
            ${filterFields.length? `<button class="btn-secondary" id="clear-filters" style="width:auto;padding:9px 16px;">✖ مسح الفلاتر</button>`:''}
            <button class="icon-btn del" id="del-board-btn">🗑️ حذف اللوحة</button>
          </div>
        </div>
        <div class="widgets-grid">
          ${widgetCards}
          <button class="widget-card add-widget-card" id="add-widget-btn">➕<br/>إضافة عنصر تحليل</button>
        </div>`;
    }

    const boardTabs = myBoards.map(b=>`<button class="board-tab ${b.id===state.analyticsBoard?'active':''}" data-board="${b.id}">${MODULES[b.sourceModule]? MODULES[b.sourceModule].icon:'📊'} ${esc(b.name)}</button>`).join('');

    page.innerHTML = `
      <div class="page-head">
        <h2>📊 تحليل البيانات</h2>
        <button class="btn-primary btn-gold" id="new-board-btn" style="width:auto;padding:10px 20px;">+ لوحة جديدة</button>
      </div>
      ${myBoards.length? `<div class="board-tabs">${boardTabs}</div>` : ''}
      ${bodyHtml}`;

    document.getElementById('new-board-btn').addEventListener('click', ()=>openBoardForm(mods));
    page.querySelectorAll('[data-board]').forEach(b=>b.addEventListener('click', ()=>{
      state.analyticsBoard=b.dataset.board; state.analyticsFilters={}; render();
    }));
    if(board){
      page.querySelectorAll('.analytics-filter').forEach(sel=>sel.addEventListener('change', ()=>{
        state.analyticsFilters[sel.dataset.field] = sel.value; render();
      }));
      const clearBtn = document.getElementById('clear-filters');
      if(clearBtn) clearBtn.addEventListener('click', ()=>{ state.analyticsFilters={}; render(); });
      document.getElementById('del-board-btn').addEventListener('click', async ()=>{
        if(!confirm('حذف اللوحة وكل عناصر التحليل بداخلها؟')) return;
        const ws = (await getData('widgets')).filter(w=>w.dashboardId===board.id);
        for(const w of ws) await apiDelete('widgets', w.id);
        invalidate('widgets');
        await apiDelete('dashboards', board.id);
        invalidate('dashboards');
        state.analyticsBoard = null;
        render();
      });
      document.getElementById('add-widget-btn').addEventListener('click', ()=>openWidgetForm(board, mod, null));
      page.querySelectorAll('[data-editw]').forEach(b=>b.addEventListener('click', ()=>{
        const w = widgets.find(x=>x.id===b.dataset.editw);
        openWidgetForm(board, mod, w);
      }));
      page.querySelectorAll('[data-delw]').forEach(b=>b.addEventListener('click', async ()=>{
        if(!confirm('حذف عنصر التحليل؟')) return;
        await apiDelete('widgets', b.dataset.delw);
        invalidate('widgets');
        render();
      }));
    }
  }

  /* ================================================================
     الإسكان: رحلات (Trips) -> فنادق (Hotels) -> غرف (Rooms) -> نزلاء (Guests)
     الفكرة: من قسم "الإسكان" تدوس على تاريخ/بطاقة الرحلة فتظهر لك فنادق
     هذه الرحلة. تدوس على الفندق فتحدد عدد الغرف وسعة كل غرفة. تدوس على
     الغرفة فتدخل بيانات كل شخص مسكّن فيها.
     ================================================================ */
  async function renderAccommodationHub(page){
    state.accomView = state.accomView || 'trips';
    if(state.accomView==='hotels') return renderHotelsList(page);
    if(state.accomView==='rooms') return renderRoomsList(page);
    if(state.accomView==='guests') return renderGuestsList(page);
    return renderTripsList(page);
  }

  function crumbsBar(items){
    return `<div class="crumbs">${items.map((it,i)=>{
      const isLast = i===items.length-1;
      const sep = i>0? `<span class="sep">›</span>` : '';
      return sep + (isLast? `<span>${esc(it.label)}</span>` : `<button data-crumb="${i}">${esc(it.label)}</button>`);
    }).join('')}</div>`;
  }
  function bindCrumbs(page, handlers){
    page.querySelectorAll('[data-crumb]').forEach(b=>b.addEventListener('click', ()=>handlers[Number(b.dataset.crumb)]()));
  }

  async function renderTripsList(page){
    const trips = (await getData('trips')).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    page.innerHTML = `
      <div class="page-head"><h2>🏨 الإسكان — الرحلات</h2>
        <button class="btn-primary btn-gold" id="add-trip-btn" style="width:auto;padding:10px 20px;">+ إضافة رحلة</button>
      </div>
      <div class="card">
        ${trips.length? `<div class="areas-grid">${trips.map(t=>`
          <div class="area-chip click-card" data-trip="${t.id}">
            <div class="cnt">📅</div><div class="nm">${esc(t.label||'رحلة')}</div>
            <div class="nm" style="color:var(--navy-700);font-weight:700;">${esc(t.date||'')}</div>
            <button class="icon-btn del" data-deltrip="${t.id}" style="margin-top:6px;">🗑️ حذف</button>
          </div>`).join('')}</div>` : `<div class="empty-state"><div class="big">📭</div>لا توجد رحلات بعد — ابدأ بالإضافة</div>`}
      </div>`;
    document.getElementById('add-trip-btn').addEventListener('click', ()=>openTripForm());
    page.querySelectorAll('[data-trip]').forEach(el=>el.addEventListener('click', (e)=>{
      if(e.target.closest('[data-deltrip]')) return;
      state.accomTripId = el.dataset.trip; state.accomView='hotels'; render();
    }));
    page.querySelectorAll('[data-deltrip]').forEach(b=>b.addEventListener('click', async (e)=>{
      e.stopPropagation();
      if(!confirm('حذف الرحلة وكل فنادقها وغرفها ونزلائها؟')) return;
      const hotels = (await getData('accom_hotels')).filter(h=>h.tripId===b.dataset.deltrip);
      const rooms = await getData('accom_rooms');
      const guests = await getData('accom_guests');
      for(const h of hotels){
        const hRooms = rooms.filter(r=>r.hotelId===h.id);
        for(const r of hRooms){
          for(const g of guests.filter(g=>g.roomId===r.id)) await apiDelete('accom_guests', g.id);
          await apiDelete('accom_rooms', r.id);
        }
        await apiDelete('accom_hotels', h.id);
      }
      await apiDelete('trips', b.dataset.deltrip);
      invalidate('trips'); invalidate('accom_hotels'); invalidate('accom_rooms'); invalidate('accom_guests');
      render();
    }));
  }

  function fieldDisplay(f, val, allData){
    if(f.type==='image'){
      return val? `<img class="row-photo" src="${val}"/>` : `<div class="row-photo"></div>`;
    }
    if(f.key==='status' || f.key==='flightStatus' || f.key==='paymentStatus'){
      const map = {'تم التواصل':'blue','تم تحديد معاد':'gold','تم الرفض':'red','تحت التفاوض':'gold',
        'لم يتم التوصل لأي شيء':'gray','لم تتم الزيارة':'gray','مكتمل':'green','جاري السداد':'gold','متأخر':'red',
        'تم الحجز':'green','لم يُحجز':'gray','جديد':'blue','تحويل لحجز':'green'};
      const cls = map[val] || 'gray';
      return val? `<span class="badge ${cls}">${esc(val)}</span>` : '';
    }
    return esc(val);
  }

  function renderRow(mod, row){
    return `<tr>${mod.fields.map(f=>`<td>${fieldDisplay(f,row[f.key])}</td>`).join('')}
      <td style="white-space:nowrap;">
        <button class="icon-btn" data-edit="${row.id}">✏️</button>
        <button class="icon-btn del" data-del="${row.id}">🗑️</button>
      </td></tr>`;
  }

      const newPassword = form.newPassword.value;

    });

  async function openForm(key, id){
    const mod = MODULES[key];
    if(!mod || !mod.roles.includes(state.user.role)) return;
    const list = await getData(key);
    const row = id? list.find(r=>r.id===id) : {};
    if(id && !prCanEditRow(key,row)){ alert('ليس لديك صلاحية لتعديل هذه البيانات'); return; }
    let refOptions = {};
    for(const f of mod.fields){
      if(f.type==='dynamicSelect'){
        let refList = await getData(f.ref);
        if(f.filter) refList = refList.filter(r=> r[f.filter.field]===f.filter.value);
        if(isPRUser() && ['pr_manager','pr_leader','pr_member'].includes(state.user.role) && f.ref==='employees'){
          if(state.user.role==='pr_manager') {}
          else {
            const names=await prAllowedNames();
            refList=refList.filter(r=>names.has(r.name));
          }
        }
        refOptions[f.key] = refList.map(r=>r[f.refField]);
      }
    }

    const modalBg = document.createElement('div');
    modalBg.className = 'modal-bg';
    modalBg.innerHTML = `<div class="modal">
      <h3>${id? 'تعديل بيانات':'إضافة جديد'} — ${esc(mod.title)}</h3>
      <form id="mod-form"><div class="form-grid">
        ${mod.fields.map(f=>renderField(f, row, refOptions)).join('')}
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="cancel-btn">إلغاء</button>
        <button type="submit" class="btn-primary btn-gold">حفظ</button>
      </div></form>
    </div>`;
    document.body.appendChild(modalBg);
    modalBg.querySelector('#cancel-btn').addEventListener('click', ()=>modalBg.remove());
    modalBg.addEventListener('click', e=>{ if(e.target===modalBg) modalBg.remove(); });

    const imgInput = modalBg.querySelector('input[type=file]');
    if(imgInput){
      imgInput.addEventListener('change', ()=>{
        const file = imgInput.files[0]; if(!file) return;
        const reader = new FileReader();
        reader.onload = ()=>{ imgInput.dataset.value = reader.result;
          const prev = modalBg.querySelector('.photo-preview'); if(prev) prev.src = reader.result; };
        reader.readAsDataURL(file);
      });
    }

    modalBg.querySelector('#mod-form').addEventListener('submit', async e=>{
      e.preventDefault();
      const isNew = !row.id;
      const newRow = row.id? {...row} : {id: uid()};
      for(const f of mod.fields){
        if(f.type==='readonly') continue;
        if(f.type==='image'){ newRow[f.key] = imgInput.dataset.value || row[f.key] || ''; continue; }
        const el = modalBg.querySelector(`[name="${f.key}"]`);
        if(el) newRow[f.key] = el.value;
      }

      /* عضو العلاقات العامة لا يستطيع إنشاء سجل باسم عضو آخر */
      if(isPRUser() && state.user.role==='pr_member'){
        const me=await currentEmployeeFresh(), myName=me?.name||state.user.name;
        if(['indoor_leads','indoor_data','subscriptions'].includes(key)) newRow.responsiblePerson=myName;
        if(key==='pr_member_data') newRow.memberId=myName;
      }
      if(isPRUser() && state.user.role==='pr_leader'){
        const names=await prAllowedNames();
        if(['indoor_leads','indoor_data','subscriptions'].includes(key) && newRow.responsiblePerson && !names.has(newRow.responsiblePerson))
          throw new Error('لا يمكن ربط البيانات بعضو خارج فريقك');
        if(key==='pr_member_data' && newRow.memberId && !names.has(newRow.memberId))
          throw new Error('لا يمكن ربط الداتا بعضو خارج فريقك');
      }

      if(isNew) await apiAdd(key, newRow); else await apiUpdate(key, newRow);
      invalidate(key);
      if(key==='indoor_leads') await maybeCreateSubscriptionFromLead(newRow);
      if(key==='subscriptions') invalidate('subscriptions');
      modalBg.remove();
      render();
    });
  }

  function renderField(f, row, refOptions){
    const val = row? (row[f.key]||'') : '';
    const full = (f.type==='textarea'||f.type==='image') ? 'full':'';
    let inner = '';
    if(f.type==='select'){
      inner = `<select name="${f.key}" ${f.required?'required':''}><option value="">اختر...</option>
        ${f.options.map(o=>`<option value="${esc(o)}" ${o===val?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
    } else if(f.type==='dynamicSelect'){
      const opts = refOptions[f.key]||[];
      inner = `<select name="${f.key}" ${f.required?'required':''}><option value="">اختر...</option>
        ${opts.map(o=>`<option value="${esc(o)}" ${o===val?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
    } else if(f.type==='textarea'){
      inner = `<textarea name="${f.key}" rows="3">${esc(val)}</textarea>`;
    } else if(f.type==='image'){
      inner = `${val?`<img class="photo-preview" src="${val}"/>`:''}<input type="file" accept="image/*" name="${f.key}"/>`;
    } else if(f.type==='readonly'){
      inner = `<input type="text" name="${f.key}" value="${esc(val)}" readonly style="background:#eee;cursor:not-allowed"/>`;
    } else {

      inner = `<input type="${f.type}" name="${f.key}" value="${esc(val)}" ${f.required?'required':''}/>`;
    }
    return `<div class="field ${full}"><label>${esc(f.label)}</label>${inner}</div>`;
  }

  (async function initAuth(){
    try{
      const saved=localStorage.getItem('homsa_session_user');
      HOMSA_SESSION=localStorage.getItem('homsa_session_token') || '';
      if(saved && HOMSA_SESSION){
        const u=new URL(GOOGLE_SHEETS_WEBHOOK);
        u.searchParams.set('action','me');
        u.searchParams.set('session',HOMSA_SESSION);
        const r=await fetch(u.toString(),{cache:'no-store'});
        const data=await r.json();
        if(data.ok) state.user=data.user;
        else { localStorage.removeItem('homsa_session_user'); localStorage.removeItem('homsa_session_token'); HOMSA_SESSION=''; }
      }
    }catch(e){ console.error('Init error',e); localStorage.removeItem('homsa_session_user'); localStorage.removeItem('homsa_session_token'); HOMSA_SESSION=''; }
    render();
  })();
})();
</script>
