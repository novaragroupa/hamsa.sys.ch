<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام إدارة همسة للسياحة</title>
</head>
<body>
<div id="app-root"></div>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');

  :root{
    --navy-900:#0c1f3d;
    --navy-800:#14315c;
    --navy-700:#1b3a6b;
    --navy-600:#25508f;
    --gold-500:#f2b705;
    --gold-600:#c99a03;
    --sand-50:#faf7f0;
    --sand-100:#f1ead8;
    --ink:#14213d;
    --line:#e3ddce;
    --muted:#6b7280;
    --danger:#b3261e;
    --success:#1a7a4c;
    --warn:#a5690a;
  }
  *{box-sizing:border-box;}
  #app-root, #app-root *{font-family:'Cairo',sans-serif;}
  #app-root{direction:rtl;color:var(--ink);background:var(--sand-50);min-height:100vh;}
  #app-root button{font-family:inherit;cursor:pointer;border:none;}
  #app-root input, #app-root select, #app-root textarea{font-family:inherit;}

  /* ---------- Login ---------- */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 30% 20%, var(--navy-700), var(--navy-900) 65%);
    padding:24px;}
  .login-card{background:#fff;border-radius:20px;width:100%;max-width:400px;overflow:hidden;
    box-shadow:0 30px 60px rgba(12,31,61,.35);position:relative;}
  .arch-top{height:110px;background:linear-gradient(160deg,var(--navy-700),var(--navy-900));
    position:relative;display:flex;align-items:center;justify-content:center;}
  .arch-top::after{content:"";position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);
    width:120px;height:60px;background:#fff;border-radius:60px 60px 0 0;}
  .arch-top img{height:56px;position:relative;z-index:2;margin-top:-10px;background:#fff;border-radius:10px;padding:4px 6px;}
  .login-body{padding:38px 32px 32px;}
  .login-body h1{font-size:20px;font-weight:800;margin:0 0 4px;color:var(--navy-900);text-align:center;}
  .login-body p.sub{text-align:center;color:var(--muted);font-size:13px;margin:0 0 26px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--navy-800);}
  .field input, .field select, .field textarea{width:100%;padding:11px 14px;border:1.5px solid var(--line);
    border-radius:10px;font-size:14px;background:var(--sand-50);transition:.15s;}
  .field input:focus, .field select:focus, .field textarea:focus{outline:none;border-color:var(--gold-500);
    background:#fff;}
  .btn-primary{width:100%;padding:12px;background:var(--navy-800);color:#fff;border-radius:10px;
    font-weight:700;font-size:15px;transition:.15s;}
  .btn-primary:hover{background:var(--navy-900);}
  .btn-gold{background:var(--gold-500);color:var(--navy-900);}
  .btn-gold:hover{background:var(--gold-600);}
  .error-box{background:#fdeceb;color:var(--danger);padding:10px 14px;border-radius:8px;font-size:13px;
    margin-bottom:16px;text-align:center;}

  /* ---------- Shell ---------- */
  .shell{display:flex;min-height:100vh;}
  .sidebar{width:250px;background:linear-gradient(180deg,var(--navy-900),var(--navy-800));color:#fff;
    display:flex;flex-direction:column;flex-shrink:0;}
  .sidebar-head{padding:22px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.1);}
  .sidebar-head img{height:34px;background:#fff;border-radius:8px;padding:3px 5px;}
  .sidebar-head span{font-weight:800;font-size:15px;}
  .nav{flex:1;overflow-y:auto;padding:14px 10px;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;color:#dfe6f2;
    font-size:14px;font-weight:600;margin-bottom:4px;transition:.15s;background:transparent;width:100%;text-align:right;}
  .nav-item:hover{background:rgba(255,255,255,.08);}
  .nav-item.active{background:var(--gold-500);color:var(--navy-900);}
  .sidebar-foot{padding:16px;border-top:1px solid rgba(255,255,255,.1);}
  .user-chip{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--gold-500);color:var(--navy-900);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0;}
  .user-chip div .name{font-size:13px;font-weight:700;}
  .user-chip div .role{font-size:11px;color:#b9c4da;}
  .logout-btn{width:100%;padding:9px;background:rgba(255,255,255,.08);color:#fff;border-radius:8px;font-size:13px;font-weight:600;}
  .logout-btn:hover{background:rgba(255,255,255,.16);}

  .main{flex:1;min-width:0;padding:26px 30px;overflow-y:auto;}
  .page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
  .page-head h2{font-size:22px;font-weight:800;color:var(--navy-900);margin:0;display:flex;align-items:center;gap:10px;}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:24px;}
  .stat-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;position:relative;overflow:hidden;}
  .stat-card::before{content:"";position:absolute;top:0;right:0;width:5px;height:100%;background:var(--gold-500);}
  .stat-card .num{font-size:26px;font-weight:800;color:var(--navy-900);}
  .stat-card .lbl{font-size:12.5px;color:var(--muted);margin-top:4px;}

  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:20px;}
  .card h3{margin:0 0 14px;font-size:15px;font-weight:800;color:var(--navy-900);}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{text-align:right;padding:10px 12px;color:var(--navy-800);font-weight:700;border-bottom:2px solid var(--sand-100);
    background:var(--sand-50);white-space:nowrap;}
  tbody td{padding:10px 12px;border-bottom:1px solid var(--sand-100);vertical-align:middle;}
  tbody tr:hover{background:var(--sand-50);}
  .table-wrap{overflow-x:auto;}
  .row-photo{width:32px;height:32px;border-radius:50%;object-fit:cover;background:var(--sand-100);}
  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700;}
  .badge.gray{background:#eef0f3;color:#555;}
  .badge.green{background:#e5f5ec;color:var(--success);}
  .badge.red{background:#fdeceb;color:var(--danger);}
  .badge.gold{background:#fff3d1;color:var(--warn);}
  .badge.blue{background:#e6eefc;color:var(--navy-700);}

  .icon-btn{background:transparent;color:var(--navy-700);font-size:13px;padding:5px 8px;border-radius:6px;}
  .icon-btn:hover{background:var(--sand-100);}
  .icon-btn.del{color:var(--danger);}

  .empty-state{text-align:center;padding:40px 20px;color:var(--muted);}
  .empty-state .big{font-size:34px;margin-bottom:8px;}

  /* modal */
  .modal-bg{position:fixed;inset:0;background:rgba(12,20,38,.55);display:flex;align-items:center;justify-content:center;
    z-index:50;padding:20px;}
  .modal{background:#fff;border-radius:16px;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;padding:26px;}
  .modal h3{margin:0 0 18px;font-size:17px;font-weight:800;color:var(--navy-900);}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .form-grid .full{grid-column:1/-1;}
  .modal-actions{display:flex;gap:10px;margin-top:20px;}
  .btn-secondary{flex:1;padding:11px;background:var(--sand-100);color:var(--navy-800);border-radius:10px;font-weight:700;font-size:14px;}
  .btn-secondary:hover{background:var(--line);}
  .modal-actions .btn-primary{flex:1;}
  .photo-preview{width:64px;height:64px;border-radius:50%;object-fit:cover;background:var(--sand-100);margin-bottom:8px;display:block;}

  .areas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
  .area-chip{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center;}
  .area-chip .cnt{font-size:20px;font-weight:800;color:var(--navy-800);}
  .area-chip .nm{font-size:12.5px;color:var(--muted);margin-top:3px;}

  .split-two{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  @media (max-width:900px){.split-two{grid-template-columns:1fr;} .form-grid{grid-template-columns:1fr;}}
  @media (max-width:760px){.sidebar{position:fixed;right:0;top:0;bottom:0;z-index:40;transform:translateX(100%);transition:.2s;}
    .sidebar.open{transform:translateX(0);} .main{padding:18px;} .menu-toggle{display:inline-flex !important;}}
  .menu-toggle{display:none;background:var(--navy-900);color:#fff;padding:8px 10px;border-radius:8px;font-size:16px;}
  .assumption-note{background:#fff3d1;border:1px solid #f0d98a;color:var(--warn);font-size:12px;padding:10px 14px;
    border-radius:10px;margin-bottom:18px;}

  /* ---------------- Analytics / لوحات تحليل البيانات ---------------- */
  .board-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
  .board-tab{padding:9px 16px;border-radius:20px;background:#fff;border:1.5px solid var(--line);color:var(--navy-800);
    font-size:13px;font-weight:700;}
  .board-tab.active{background:var(--navy-800);color:#fff;border-color:var(--navy-800);}
  .analytics-filterbar{display:flex;gap:10px;flex-wrap:wrap;flex:1;}
  .analytics-filter{padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:13px;background:#fff;
    color:var(--navy-800);min-width:140px;}
  .widgets-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;}
  .widget-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;text-align:right;}
  .widget-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px;}
  .widget-head h4{margin:0;font-size:14px;font-weight:800;color:var(--navy-900);}
  .add-widget-card{display:flex;align-items:center;justify-content:center;flex-direction:column;background:var(--sand-100);
    border:1.5px dashed var(--gold-500);color:var(--gold-600);font-weight:700;font-size:13.5px;min-height:120px;
    text-align:center;line-height:1.9;}
  .add-widget-card:hover{background:#fff3d1;}
  .pie-wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
  .pie-donut-wrap{position:relative;width:120px;height:120px;flex-shrink:0;}
  .pie-donut{width:100%;height:100%;border-radius:50%;}
  .pie-hole{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:56px;height:56px;
    border-radius:50%;background:#fff;}
  .pie-legend{flex:1;min-width:140px;}
  .legend-row{display:flex;align-items:center;gap:8px;font-size:12.5px;margin-bottom:6px;}
  .legend-row .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  .legend-row .legend-lbl{flex:1;color:var(--ink);}
  .legend-row .legend-val{color:var(--muted);font-weight:700;white-space:nowrap;}
  .bar-wrap{display:flex;flex-direction:column;gap:10px;}
  .bar-row{display:flex;align-items:center;gap:10px;font-size:12.5px;}
  .bar-lbl{width:90px;flex-shrink:0;color:var(--navy-800);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bar-track{flex:1;height:16px;background:var(--sand-100);border-radius:8px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:8px;}
  .bar-val{width:34px;text-align:left;font-weight:700;color:var(--navy-900);}
  .stat-number{font-size:44px;font-weight:800;color:var(--navy-900);text-align:center;padding:20px 0;}
  .empty-mini{color:var(--muted);font-size:12.5px;text-align:center;padding:20px 0;}

  /* ---------------- الإسكان (Trips -> Hotels -> Rooms -> Guests) ---------------- */
  .crumbs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:16px;font-size:13px;color:var(--navy-800);}
  .crumbs button{background:transparent;color:var(--navy-700);font-weight:700;padding:4px 8px;border-radius:6px;}
  .crumbs button:hover{background:var(--sand-100);}
  .crumbs .sep{color:var(--muted);}
  .click-card{cursor:pointer;transition:.15s;}
  .click-card:hover{box-shadow:0 6px 16px rgba(12,31,61,.12);transform:translateY(-2px);}
  .progress-track{height:8px;background:var(--sand-100);border-radius:6px;overflow:hidden;margin-top:8px;}
  .progress-fill{height:100%;border-radius:6px;background:var(--navy-600);}

  /* ---------------- شيت البيانات القابل للتعديل المباشر ---------------- */
  .cell-input{width:100%;padding:6px 8px;border:1px solid transparent;border-radius:6px;background:transparent;font-size:13px;}
  .cell-input:hover{border-color:var(--line);}
  .cell-input:focus{outline:none;border-color:var(--gold-500);background:#fff;}
  .sheet-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
  .sheet-toolbar a.icon-btn{text-decoration:none;display:inline-flex;align-items:center;}
  /* ---------------- PR team hierarchy ---------------- */
  .pr-team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;}
  .pr-team-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;cursor:pointer;transition:.15s;}
  .pr-team-card:hover{box-shadow:0 8px 20px rgba(12,31,61,.12);transform:translateY(-2px);}
  .pr-team-card .team-title{font-size:16px;font-weight:800;color:var(--navy-900);margin-bottom:8px;}
  .pr-team-card .team-meta{font-size:12px;color:var(--muted);line-height:1.8;}
  .member-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;}
  .member-card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px;cursor:pointer;}
  .member-card:hover{box-shadow:0 7px 18px rgba(12,31,61,.11);}
  .member-card .member-name{font-weight:800;color:var(--navy-900);font-size:15px;}
  .member-card .member-role{font-size:11.5px;color:var(--muted);margin-top:3px;}
  .member-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px;}
  .member-stat{background:var(--sand-50);border-radius:9px;padding:8px;text-align:center;}
  .member-stat b{display:block;font-size:16px;color:var(--navy-800);}
  .member-stat span{font-size:10px;color:var(--muted);}
  .detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;}
  .detail-item{background:var(--sand-50);border-radius:10px;padding:11px;}
  .detail-item .k{font-size:11px;color:var(--muted);margin-bottom:3px;}
  .detail-item .v{font-size:13px;font-weight:700;word-break:break-word;}
  .link-box{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;}
  .link-box a{color:var(--navy-700);font-weight:700;text-decoration:none;}
</style>

<script>
(function(){
  const LOGO = "logo.png";
  /* اللوجو بيتحمّل من ملف صورة اسمه logo.png، موجود في نفس مستوى index.html
     في الريبو (root) — زي ما هو فعليًا على GitHub دلوقتي. */
  /* النظام يعمل بدون Supabase. الحسابات والبيانات تُحفظ في Google Sheets. */
  async function sha256(text){
    const data = new TextEncoder().encode(String(text));
    const hash = await crypto.subtle.digest('SHA-256', data);
    return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }
  const DEFAULT_ADMIN = {id:'admin-001', name:'مدير النظام', username:'admin', passwordHash:'240be518fabd2724ddb6f04eeb1da5967448d7e831c08c8fa822809f74c720a9', role:'admin', status:'active'};
  const ROLE_LABELS = {
    admin:'مدير النظام', hr:'HR',
    pr_manager:'المدير العام للعلاقات العامة',
    pr_leader:'رئيس فريق - العلاقات العامة',
    pr_member:'عضو فريق - العلاقات العامة',
    pr_out:'علاقات عامة - أوت دور', pr_in:'علاقات عامة - إن دور',
    reception:'استقبال', accounting:'حسابات', callcenter:'كول سنتر', accommodation:'تسكين', system:'حجوزات النظام',
    analyst:'مسؤول تحليل البيانات'
  };

  const ALEX_AREAS = ['سيدي جابر','سموحة','ستانلي','جليم','لوران','رشدي','الإبراهيمية','فلمنج','محرم بك',
    'كرموز','العطارين','المنشية','باكوس','العجمي','المندرة','أبو قير','سيدي بشر','المعمورة','برج العرب','الأزاريطة'];

  /* ---------------- Module definitions (generic CRUD engine) ---------------- */
  const MODULES = {
    teams:{ title:'الفرق', icon:'🧩', roles:['admin','hr','pr_manager'],
      fields:[
        {key:'name', label:'اسم الفريق', type:'text', required:true},
        {key:'department', label:'القسم', type:'select', options:Object.values(ROLE_LABELS)},
        {key:'leader', label:'قائد الفريق (Team Leader)', type:'dynamicSelect', ref:'employees', refField:'name'},
        {key:'notes', label:'ملاحظات', type:'textarea'},
      ]},
    employees:{ title:'الموظفون', icon:'👥', roles:['admin','hr','pr_manager','pr_leader','pr_member'],
      fields:[
        {key:'photo', label:'الصورة', type:'image'},
        {key:'name', label:'الاسم', type:'text', required:true},
        {key:'specialNumber', label:'الرقم القومي', type:'text'},
        {key:'companyNumber', label:'رقم الشركة', type:'text'},
        {key:'department', label:'القسم', type:'select', options:Object.values(ROLE_LABELS)},
        {key:'team', label:'الفريق', type:'dynamicSelect', ref:'teams', refField:'name'},
        {key:'phone', label:'رقم الهاتف', type:'text'},
        {key:'address', label:'العنوان', type:'text'},
        {key:'hireDate', label:'تاريخ التعيين', type:'date'},
        {key:'salary', label:'الراتب', type:'number'},
        {key:'username', label:'اسم المستخدم', type:'readonly'},
        {key:'status', label:'حالة الموظف', type:'select', options:['active','inactive']},
      ]},
    companies:{ title:'الشركات (أوت دور)', icon:'🏢', roles:['admin','pr_out'],
      fields:[
        {key:'name', label:'اسم الشركة', type:'text', required:true},
        {key:'area', label:'الحي / المنطقة', type:'select', options:ALEX_AREAS},
        {key:'contactName', label:'اسم المسؤول', type:'text'},
        {key:'contactPhone', label:'رقم المسؤول', type:'text'},
        {key:'responsiblePerson', label:'مندوب العلاقات العامة المسؤول', type:'dynamicSelect',
          ref:'employees', refField:'name', filter:{field:'department', value:'علاقات عامة - أوت دور'}},
        {key:'details', label:'تفاصيل', type:'textarea'},
      ]},
    visits:{ title:'تقارير الزيارات', icon:'📋', roles:['admin','pr_out'],
      fields:[
        {key:'companyName', label:'الشركة', type:'text', required:true},
        {key:'visitedBy', label:'الموظف اللي عمل الزيارة', type:'dynamicSelect',
          ref:'employees', refField:'name'},
        {key:'date', label:'تاريخ الزيارة', type:'date'},
        {key:'status', label:'حالة الزيارة', type:'select',
          options:['تم التواصل','لم تتم الزيارة','تم تحديد معاد','تم الرفض','تحت التفاوض','لم يتم التوصل لأي شيء']},
        {key:'notes', label:'ملاحظات', type:'textarea'},
      ]},
    indoor_leads:{ title:'المهتمون والمندوبين', icon:'🎯', roles:['admin','pr_in','pr_manager','pr_leader','pr_member'],
      fields:[
        {key:'name', label:'الاسم', type:'text', required:true},
        {key:'code', label:'كود العميل', type:'readonly'},
        {key:'phone', label:'رقم الهاتف', type:'text'},
        {key:'nationalId', label:'الرقم القومي', type:'text'},
        {key:'registrationDate', label:'تاريخ التسجيل', type:'date', required:true},
        {key:'type', label:'النوع', type:'select', options:['مهتم','مندوب']},
        {key:'company', label:'الشركة', type:'dynamicSelect', ref:'companies', refField:'name'},
        {key:'status', label:'الحالة', type:'select', options:['جديد','تم التواصل','تحويل لحجز','مشترك']},
        {key:'sourceType', label:'جاي عن طريق', type:'select',
          options:['مندوب','علاقات عامة','ريسبشن','ميديا']},
        {key:'responsiblePerson', label:'اسم المسؤول عنه', type:'dynamicSelect', ref:'employees', refField:'name'},
        {key:'managerRep', label:'شغال تحت إشراف مندوب', type:'dynamicSelect',
          ref:'indoor_leads', refField:'name', filter:{field:'type', value:'مندوب'}},
        {key:'notes', label:'ملاحظات', type:'textarea'},
      ]},
    indoor_data:{ title:'الداتا والأرقام', icon:'📊', roles:['admin','pr_in','pr_manager','pr_leader','pr_member'],
      fields:[
        {key:'name', label:'الاسم', type:'text'},

  /* ---------------- Google Sheets backend ---------------- */
  const GOOGLE_SHEETS_WEBHOOK = 'https://script.google.com/macros/s/AKfycbw7Cnm2cgOiB_6MJ2DJYP8NsLaNDXtbaJKRrLiri4LizkMr7s1Q8-AOzRX8uEg5t_pr/exec';
  let HOMSA_SESSION = localStorage.getItem('homsa_session_token') || '';

  async function sheetRequest(action, table, payload){
    if(!GOOGLE_SHEETS_WEBHOOK) throw new Error('رابط Google Sheets غير مضبوط');
    if(!HOMSA_SESSION) throw new Error('انتهت جلسة الدخول — سجّل الدخول مرة أخرى');
    if(action==='list'){
      const u = new URL(GOOGLE_SHEETS_WEBHOOK);
      u.searchParams.set('action','list');
      u.searchParams.set('table',table);
      u.searchParams.set('session',HOMSA_SESSION);
      const r=await fetch(u.toString(),{cache:'no-store'});
      const data=await r.json();
      if(!data.ok) {
        if(data.error==='Unauthorized'){ HOMSA_SESSION=''; localStorage.removeItem('homsa_session_token'); }
        throw new Error(data.error||'فشل تحميل البيانات من Google Sheets');
      }
      return data.rows||[];
    }
    const r=await fetch(GOOGLE_SHEETS_WEBHOOK,{method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action,table,payload,session:HOMSA_SESSION,at:new Date().toISOString()}),
      keepalive:true});
    const data=await r.json().catch(()=>({ok:true}));
    if(!data.ok) throw new Error(data.error||'فشل حفظ البيانات في Google Sheets');
    return data;
  }

  // بيجيب أكتر من جدول بنداء HTTP واحد بس (action=bulk) بدل نداء منفصل لكل جدول،
  // وده أكبر سبب في إن الشاشات كانت بطيئة: كل نداء لـ Apps Script بياخد وقت بدء تشغيل لوحده.
  async function sheetRequestBulk(tables){
    if(!GOOGLE_SHEETS_WEBHOOK) throw new Error('رابط Google Sheets غير مضبوط');
    if(!HOMSA_SESSION) throw new Error('انتهت جلسة الدخول — سجّل الدخول مرة أخرى');
    const u=new URL(GOOGLE_SHEETS_WEBHOOK);
    u.searchParams.set('action','bulk');
    u.searchParams.set('tables',tables.join(','));
    u.searchParams.set('session',HOMSA_SESSION);
    const r=await fetch(u.toString(),{cache:'no-store'});
    const data=await r.json();
    if(!data.ok){
      if(data.error==='Unauthorized'){ HOMSA_SESSION=''; localStorage.removeItem('homsa_session_token'); }
      throw new Error(data.error||'فشل تحميل البيانات من Google Sheets');
    }
    return data.tables||{};
  }

  /* ---------------- Storage helpers ---------------- */
  async function loadList(key){
    try{ return await sheetRequest('list',key); }
    catch(e){ console.error('Google Sheets load error', key, e); return []; }
  }

  async function apiAdd(table, record){
    if(!record.id) record.id=uid();
    await sheetRequest('upsert',table,record);
    cacheUpsertLocal(table, record);
    if(table==='subscriptions') invalidate('accom_guests');
    return record;
  }

  async function apiUpdate(table, record){
    await sheetRequest('upsert',table,record);
    cacheUpsertLocal(table, record);
    if(table==='subscriptions') invalidate('accom_guests');
  }

  async function apiDelete(table, id){
    await sheetRequest('delete',table,{id});
    cacheDeleteLocal(table, id);
    if(table==='subscriptions') invalidate('accom_guests');
  }

  // بيمسح مجموعة IDs بنداء واحد. لو مفيش IDs أو الباك إند القديم رافض action دي،
  // بيرجع تلقائيًا لطريقة الحذف الفردي (متوازي) عشان النظام يفضل شغال حتى مع نسخة سيرفر قديمة.
  async function apiDeleteMany(table, ids){
    ids = (ids||[]).filter(Boolean);
    if(!ids.length) return;
    try{
      await sheetRequest('batchDelete',table,{ids});
      ids.forEach(id=>cacheDeleteLocal(table,id));
      if(table==='subscriptions') invalidate('accom_guests');
    }catch(e){
      console.error('batchDelete fallback', table, e);
      await Promise.all(ids.map(id=>apiDelete(table,id)));
      if(table==='subscriptions') invalidate('accom_guests');
    }
  }

  // بيحفظ مجموعة صفوف بنداء واحد، ولو حصل خطأ بيرجع لطريقة الحفظ الفردي (متوازي)
  async function apiAddMany(table, records){
    records = (records||[]).filter(Boolean);
    if(!records.length) return records;
    records.forEach(r=>{ if(!r.id) r.id=uid(); });
    try{
      await sheetRequest('batchUpsert',table,{rows:records});
      records.forEach(r=>cacheUpsertLocal(table,r));
      if(table==='subscriptions') invalidate('accom_guests');
    }catch(e){
      console.error('batchUpsert fallback', table, e);
      await Promise.all(records.map(r=>sheetRequest('upsert',table,r)));
      records.forEach(r=>cacheUpsertLocal(table,r));
      if(table==='subscriptions') invalidate('accom_guests');
    }
    return records;
  }

  const cache = {};
  async function getData(key){ if(!cache[key]) cache[key] = await loadList(key); return cache[key]; }
  function invalidate(key){ cache[key] = null; }

  // بعد أي حفظ/تعديل/حذف ناجح، بنحدّث الكاش المحلي فورًا بدل ما نمسحه ونرجع نطلب
  // الجدول تاني من السيرفر (اللي كان بيضاعف وقت كل عملية حفظ أو حذف في النظام).
  function cacheUpsertLocal(table, record){
    if(!cache[table] || !record || record.id===undefined) return;
    const idx = cache[table].findIndex(r=>String(r.id)===String(record.id));
    if(idx>=0) cache[table][idx] = {...cache[table][idx], ...record};
    else cache[table] = [...cache[table], record];
  }
  function cacheDeleteLocal(table, id){
    if(!cache[table]) return;
    cache[table] = cache[table].filter(r=>String(r.id)!==String(id));
  }

  // بيجيب كذا جدول مع بعض على التوازي (نداء واحد للسيرفر لو مش متخزنين، فوري لو متخزنين بالفعل).
  // بنستخدمها في أول أي شاشة تحتاج أكتر من جدول عشان منستناش كل جدول لوحده بالدور.
  async function getDataMany(keys){
    const need = [...new Set(keys)].filter(k=>!cache[k]);
    if(need.length){
      try{
        const result = await sheetRequestBulk(need);
        need.forEach(k=>{ cache[k] = result[k] || []; });
      }catch(e){
        console.error('bulk load error, falling back to parallel single loads', e);
        await Promise.all(need.map(async k=>{ cache[k] = await loadList(k); }));
      }
    }
    const out={}; keys.forEach(k=>out[k]=cache[k]||[]); return out;
  }

  function uid(){ return 'id'+Math.random().toString(36).slice(2,10); }
  function esc(s){ return (s===undefined||s===null)?'':String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function linkLabel(ref, r){
    if(!r) return '';
    if(ref==='trips') return (r.label? r.label+' — ':'') + (r.date||'بدون تاريخ');
    if(ref==='accom_hotels') return r.name + (r.location? ' — '+r.location : '');
    if(ref==='accom_rooms') return 'غرفة ' + (r.roomNumber||'');
    return r.name || r.title || r.id;
  }

  /* كود العميل: حرفين "ID" + آخر 4 أرقام من رقم الهاتف + تاريخ اليوم (يوم/شهر) بدون فواصل.
     يُنشأ مرة واحدة فقط عند أول تسجيل ولا يتغيّر بعد ذلك. */
  function generateCustomerCode(phone){
    const digits = String(phone||'').replace(/\D/g,'');
    const last4 = (digits.slice(-4) || '0000').padStart(4,'0');
    const now = new Date();
    const dd = String(now.getDate()).padStart(2,'0');
    const mm = String(now.getMonth()+1).padStart(2,'0');
    return 'ID' + last4 + dd + mm;
  }

  /* حماية من الضغط المتكرر على زرار "حفظ": بتعطّل الزرار فورًا (قبل أي انتظار
     شبكة) عشان تمنع إنشاء أكتر من سجل لنفس الإدخال بسبب دبل كليك أو ضغط سريع
     متكرر. عند فشل الحفظ بترجع الزرار زي ما كان عشان المستخدم يقدر يحاول تاني. */
  function submitGuard(form){
    const btn = form.querySelector('button[type=submit]');
    if(!btn) return {ok:true, release:()=>{}};
    if(btn.disabled) return {ok:false, release:()=>{}};
    const origText = btn.textContent;
    btn.disabled = true; btn.textContent = 'جارٍ الحفظ...';
    return {ok:true, release:()=>{ btn.disabled=false; btn.textContent=origText; }};
  }

  /* بيحسب خيارات قائمة linkSelect المتتالية (Trip -> Hotel -> Room). بما إن
     الفنادق بقت كيان مستقل عن الرحلات، الحالة الخاصة هنا (subscriptions.hotelId)
     بتجيب فنادق الرحلة المختارة من جدول الربط trip_hotels بدل الاعتماد على حقل
     tripId قديم داخل الفندق نفسه. */
  async function linkSelectOptionsFor(moduleKey, f, parentVal){
    if(moduleKey==='subscriptions' && f.key==='hotelId' && f.ref==='accom_hotels' && f.parentKey==='tripId'){
      if(!parentVal) return [];
      const tripHotels = await getData('trip_hotels');
      const hotels = await getData('accom_hotels');
      const hotelIds = tripHotels.filter(th=>String(th.tripId)===String(parentVal)).map(th=>th.hotelId);
      return hotels.filter(h=>hotelIds.includes(h.id)).map(h=>({id:h.id, label: linkLabel('accom_hotels', h)}));
    }
    const refList = await getData(f.ref);
    if(!f.parentKey) return refList.map(r=>({id:r.id, label: linkLabel(f.ref, r)}));
    const list = parentVal? refList.filter(r=> String(r[f.parentKey])===String(parentVal)) : [];
    return list.map(r=>({id:r.id, label: linkLabel(f.ref, r)}));
  }


  /* ---------------- PR access control ---------------- */
  function isPRUser(){ return ['pr_manager','pr_leader','pr_member'].includes(state.user?.role); }
  function currentEmployee(){
    if(!state.user) return null;
    const list = cache.employees || [];
    return list.find(e => (e.username && state.user.username && String(e.username).toLowerCase()===String(state.user.username).toLowerCase())
      || e.id===state.user.employeeId) || null;
  }
  async function currentEmployeeFresh(){
    const emps=await getData('employees');
    return emps.find(e => (e.username && state.user.username && String(e.username).toLowerCase()===String(state.user.username).toLowerCase())
      || e.id===state.user.employeeId) || null;
  }
  async function prTeamName(){
    const emp=await currentEmployeeFresh();
    return emp?.team || state.user?.team || '';
  }
  async function prTeamMembers(){
    const emps=await getData('employees');
    if(state.user.role==='pr_manager') return emps.filter(e=>e.status!=='inactive');
    const team=await prTeamName();
    return emps.filter(e=>e.status!=='inactive' && e.team===team);
  }
  async function prAllowedNames(){
    const members=await prTeamMembers();
    return new Set(members.map(e=>e.name).filter(Boolean));
  }
  async function filterPRData(key,data){
    if(!isPRUser()) return data;
    if(state.user.role==='pr_manager') return data;
    const emp=await currentEmployeeFresh();
    const myName=emp?.name || state.user.name;
    const teamNames=await prAllowedNames();
    if(key==='employees') return data.filter(r=>teamNames.has(r.name));
    if(key==='teams') {
      const team=await prTeamName();
      return data.filter(r=>r.name===team);
    }
    if(key==='indoor_leads' || key==='indoor_data' || key==='subscriptions'){
      return data.filter(r=>teamNames.has(r.responsiblePerson) && (state.user.role==='pr_leader' || r.responsiblePerson===myName));
    }
    if(key==='pr_member_data'){
      return data.filter(r=>teamNames.has(r.memberId) && (state.user.role==='pr_leader' || r.memberId===myName));
    }
    return data;
  }
  function prCanEditRow(key,row){
    if(!isPRUser()) return true;
    if(state.user.role==='pr_manager') return true;
    const myName = currentEmployee()?.name || state.user.name;
    if(state.user.role==='pr_leader'){
      if(['indoor_leads','indoor_data','subscriptions'].includes(key)) return true;
      if(key==='pr_member_data') return true;
      return false;
    }
    if(key==='indoor_leads' || key==='indoor_data' || key==='subscriptions') return !row?.id || row.responsiblePerson===myName;
    if(key==='pr_member_data') return !row?.id || row.memberId===myName;
    return key==='employees' && row?.name===myName;
  }
  async function maybeCreateSubscriptionFromLead(lead){
    if(lead.type!=='مهتم' || lead.status!=='مشترك') return;
    const subs=await getData('subscriptions');
    if(subs.some(s=>String(s.leadId||'')===String(lead.id))) return;
    const sub={
      id:uid(), leadId:lead.id, customerName:lead.name||'', nationalId:lead.nationalId||'', phone:lead.phone||'',
      responsiblePerson:lead.responsiblePerson||'', subscriptionDate:new Date().toISOString().slice(0,10),
      packageType:'', subscriptionStatus:'نشط', notes:lead.notes||''
    };
    await apiAdd('subscriptions',sub);
  }

  // بيربط الاشتراك بالتسكين (الفندق/الغرفة) تلقائيًا: لما يتحدد roomId في الاشتراك
  // بيضيف/يحدّث نزيل في accom_guests علشان يظهر العميل في شاشة "الإسكان" أوتوماتيك.
  // لو تم شيل الغرفة من الاشتراك بيتشال النزيل المرتبط بيه.
  async function syncSubscriptionGuest(sub){
    const guests = await getData('accom_guests');
    const existing = guests.find(g=>String(g.subscriptionId||'')===String(sub.id));

    if(!sub.roomId){
      if(existing) await apiDelete('accom_guests', existing.id);
      return;
    }

    const rec = {
      id: existing? existing.id : uid(),
      subscriptionId: sub.id,
      roomId: sub.roomId,
      tripId: sub.tripId||'',
      name: sub.customerName||'',
      nationalId: sub.nationalId||'',
      phone: sub.phone||'',
      passportNumber: existing? (existing.passportNumber||'') : '',
      flightStatus: existing? (existing.flightStatus||'لم يُحجز') : 'لم يُحجز',
      notes: existing? (existing.notes||'') : ''
    };
    if(existing) await apiUpdate('accom_guests', rec); else await apiAdd('accom_guests', rec);
  }

      const u = document.getElementById('login-u').value.trim().toLowerCase();
      const p = document.getElementById('login-p').value;
      btn.textContent = 'جارٍ الدخول...'; btn.disabled = true;
      try{
        const response = await fetch(GOOGLE_SHEETS_WEBHOOK,{
          method:'POST',
          headers:{'Content-Type':'text/plain;charset=utf-8'},
          body:JSON.stringify({action:'login',username:u,password:p}),
          cache:'no-store'
        });
        const data = await response.json();
        if(!data.ok) throw new Error(data.error||'اسم المستخدم أو كلمة المرور غير صحيحة');
        HOMSA_SESSION=data.session;
        localStorage.setItem('homsa_session_token',HOMSA_SESSION);
        state.user = data.user; state.loginError=null; state.view='dashboard';
        localStorage.setItem('homsa_session_user', JSON.stringify(data.user));
        render();
      }catch(err){
        console.error('Login error', err);
        state.loginError = err.message || 'تعذر تسجيل الدخول';
        renderLogin();
      }
    });
  }


  function accessibleModules(){
    const hiddenModules = new Set(['companies','callcenter_payments','indoor_data']);
    if(state.user?.role==='pr_manager') {
      return Object.entries(MODULES).filter(([k,m])=>!hiddenModules.has(k) && m.roles.includes('pr_manager'));
    }
    if(state.user?.role==='pr_leader' || state.user?.role==='pr_member') {
      return Object.entries(MODULES).filter(([k,m])=>!hiddenModules.has(k) && m.roles.includes(state.user.role));
    }
    return Object.entries(MODULES).filter(([k,m])=>!hiddenModules.has(k) && m.roles.includes(state.user.role));
  }

  function analyticsAccessibleModules(){
    // مسؤول تحليل البيانات (analyst) والمدير يقدروا يبنوا لوحات تحليل من أي قسم في النظام
    if(state.user.role==='admin' || state.user.role==='analyst') return Object.entries(MODULES).filter(([k])=>!['companies','callcenter_payments','indoor_data'].includes(k));
    return accessibleModules();
  }

  async function getSetting(key){
    const rows = await getData('app_settings');
    const row = rows.find(r=>r.key===key);
    return row? (row.value||'') : '';
  }
  async function setSetting(key, value){
    const rows = await getData('app_settings');
    const row = rows.find(r=>r.key===key);
    const rec = row? {...row, value} : {id:'cfg_'+key, key, value};
    await apiAdd('app_settings', rec);
  }

  async function renderPage(){
    const page = document.getElementById('page');
    if(!page) return;
    const mods = accessibleModules();
    if(['areas','ledger','companies','callcenter_payments','indoor_data'].includes(state.view)){
      state.view='dashboard'; updateActiveNav();
    }
    if(state.view==='dashboard') await renderDashboard(page, mods);
    else if(state.view==='pr_teams') await renderPRHierarchy(page);
    else if(state.view==='analytics') await renderAnalytics(page, analyticsAccessibleModules());
    else if(state.view==='accommodation') await renderAccommodationSection(page);
    else if(state.view==='trips_hub') await renderTripsHub(page);
    else if(MODULES[state.view]) await renderModule(page, state.view);
  }

  function num_(v){ const n = parseFloat(v); return isNaN(n)? 0 : n; }

  async function renderLedger(page){
    const entries = await getData('accounting');
    const clients = [...new Set(entries.map(e=>e.clientName).filter(Boolean))].sort();
    const sel = state.ledgerClient;

    const header = `
      <div class="page-head">
        <h2>💰 كشف الحساب${sel? ' — '+esc(sel):''}</h2>
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
          <select id="ledger-client-filter" style="padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;">
            <option value="">كل العملاء</option>
            ${clients.map(c=>`<option value="${esc(c)}" ${c===sel?'selected':''}>${esc(c)}</option>`).join('')}
          </select>
          <button class="btn-primary btn-gold" id="add-ledger-btn" style="width:auto;padding:10px 20px;">+ إضافة قيد</button>
        </div>
      </div>`;

    if(!sel){
      // summary per client
      const rows = clients.map(c=>{
        const list = entries.filter(e=>e.clientName===c);
        const totalDebit = list.reduce((s,e)=>s+num_(e.debit),0);
        const totalCredit = list.reduce((s,e)=>s+num_(e.credit),0);
        const balance = totalDebit - totalCredit;
        return {c, totalDebit, totalCredit, balance};
      });
      const grandDebit = rows.reduce((s,r)=>s+r.totalDebit,0);
      const grandCredit = rows.reduce((s,r)=>s+r.totalCredit,0);
      page.innerHTML = header + `
        <div class="stat-grid">
          <div class="stat-card"><div class="num">${money_(grandDebit)}</div><div class="lbl">إجمالي المدين (على العملاء)</div></div>
          <div class="stat-card"><div class="num">${money_(grandCredit)}</div><div class="lbl">إجمالي الدائن (المحصّل)</div></div>
          <div class="stat-card"><div class="num">${money_(grandDebit-grandCredit)}</div><div class="lbl">صافي المتبقي على العملاء</div></div>
        </div>
        <div class="card">
          ${rows.length? `<div class="table-wrap"><table>
            <thead><tr><th>العميل</th><th>إجمالي مدين</th><th>إجمالي دائن</th><th>الرصيد</th><th></th></tr></thead>
            <tbody>${rows.map(r=>`<tr>
              <td>${esc(r.c)}</td><td>${money_(r.totalDebit)}</td><td>${money_(r.totalCredit)}</td>
              <td><span class="badge ${r.balance>0?'red':(r.balance<0?'blue':'green')}">${money_(r.balance)}</span></td>
              <td><button class="icon-btn" data-open="${esc(r.c)}">عرض كشف الحساب ↗</button></td>
            </tr>`).join('')}</tbody>
          </table></div>` : `<div class="empty-state"><div class="big">📭</div>لا توجد قيود بعد — ابدأ بإضافة قيد</div>`}
        </div>`;
      page.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click', ()=>{ state.ledgerClient=b.dataset.open; render(); }));
    } else {
      const list = entries.filter(e=>e.clientName===sel).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
      let running = 0;
      const rowsHtml = list.map(e=>{
        running += num_(e.debit) - num_(e.credit);
        return `<tr>
          <td>${esc(e.date)}</td><td>${esc(e.description)}</td><td>${esc(e.packageType)}</td>
          <td>${e.debit? money_(e.debit):'—'}</td><td>${e.credit? money_(e.credit):'—'}</td>
          <td><b>${money_(running)}</b></td>
          <td style="white-space:nowrap;"><button class="icon-btn" data-edit="${e.id}">✏️</button><button class="icon-btn del" data-del="${e.id}">🗑️</button></td>
        </tr>`;
      }).join('');
      const totalDebit = list.reduce((s,e)=>s+num_(e.debit),0);
      const totalCredit = list.reduce((s,e)=>s+num_(e.credit),0);
      page.innerHTML = header + `
        <button class="icon-btn" id="back-to-clients" style="margin-bottom:14px;">→ رجوع لكل العملاء</button>
        <div class="stat-grid">

  /* ================================================================
     Analytics — لوحات تحليل بيانات قابلة للتخصيص لكل قسم
     كل قسم عنده امكانية يعمل "لوحة" مرتبطة بمصدر بيانات (أي موديول)،
     ويضيف فيها عناصر تحليل (دائري / أعمدة / جدول / رقم) بنفسه، ويقدر
     كمان يقسّم أي عنصر حسب "الفريق" لو الحقل مرتبط بموظف.
     مسؤول تحليل البيانات (analyst) شايف كل الأقسام بدون استثناء.
     ================================================================ */
  const CHART_COLORS = ['#b3261e','#f2b705','#1a7a4c','#25508f','#a5690a','#6b7280',
    '#8b5cf6','#0891b2','#dc2626','#059669','#d97706','#0284c7'];

  function moduleDimensionOptions(mod){
    const opts = [];
    mod.fields.forEach(f=>{
      if(f.type==='select' || f.type==='dynamicSelect'){
        opts.push({key:f.key, label:f.label});
        if(f.type==='dynamicSelect' && f.ref==='employees'){
          opts.push({key:f.key+'__team', label:f.label+' — الفريق'});
        }
      }
    });
    return opts;
  }
  function moduleMetricFields(mod){ return mod.fields.filter(f=>f.type==='number'); }
  function moduleFilterFields(mod){ return mod.fields.filter(f=>f.type==='select' || f.type==='dynamicSelect'); }

  async function employeeTeamMap(){
    const emps = await getData('employees');
    const map = {};
    emps.forEach(e=>{ if(e.name) map[e.name] = e.team || 'بدون فريق'; });
    return map;
  }

  function dimValue(row, dimKey, teamMap){
    if(dimKey.endsWith('__team')){
      const base = dimKey.slice(0, -('__team'.length));
      const person = row[base];
      return (person && teamMap[person]) || 'بدون فريق';
    }
    return row[dimKey] || 'غير محدد';
  }

  function groupAndAggregate(rows, dimKey, metric, metricField, teamMap){
    if(!dimKey){
      const total = metric==='sum'? rows.reduce((s,r)=>s+num_(r[metricField]),0) : rows.length;
      return [{label:'الإجمالي', value: total}];
    }
    const map = {};
    rows.forEach(r=>{
      const g = dimValue(r, dimKey, teamMap);
      if(!(g in map)) map[g]=0;
      map[g] += (metric==='sum') ? num_(r[metricField]) : 1;
    });
    return Object.entries(map).map(([k,v])=>({label:k, value:v})).sort((a,b)=>b.value-a.value);
  }

  function renderPieWidget(entries){
    const total = entries.reduce((s,e)=>s+e.value,0) || 1;
    let acc = 0;
    const stops = entries.map((e,i)=>{
      const start = acc/total*360; acc += e.value; const end = acc/total*360;
      return `${CHART_COLORS[i % CHART_COLORS.length]} ${start}deg ${end}deg`;
    }).join(', ');
    const legend = entries.map((e,i)=>{
      const pct = Math.round(e.value/total*1000)/10;
      return `<div class="legend-row"><span class="dot" style="background:${CHART_COLORS[i % CHART_COLORS.length]}"></span>
        <span class="legend-lbl">${esc(e.label)}</span><span class="legend-val">${e.value} (${pct}%)</span></div>`;
    }).join('');
    return `<div class="pie-wrap">
      <div class="pie-donut-wrap"><div class="pie-donut" style="background:conic-gradient(${entries.length?stops:'#eee 0deg 360deg'});"></div><div class="pie-hole"></div></div>
      <div class="pie-legend">${legend || '<div class="empty-mini">لا توجد بيانات</div>'}</div>
    </div>`;
  }

  function renderBarWidget(entries){
    if(!entries.length) return '<div class="empty-mini">لا توجد بيانات</div>';
    const max = Math.max(1, ...entries.map(e=>e.value));
    return `<div class="bar-wrap">${entries.map((e,i)=>{
      const pct = Math.round(e.value/max*100);
      return `<div class="bar-row"><div class="bar-lbl">${esc(e.label)}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${CHART_COLORS[i % CHART_COLORS.length]};"></div></div>
        <span class="bar-val">${e.value}</span></div>`;
    }).join('')}</div>`;
  }

  function renderTableWidget(entries){
    return `<div class="table-wrap"><table><thead><tr><th>الفئة</th><th>القيمة</th></tr></thead>
      <tbody>${entries.length? entries.map(e=>`<tr><td>${esc(e.label)}</td><td><b>${e.value}</b></td></tr>`).join('') :
      `<tr><td colspan="2" style="text-align:center;color:var(--muted);">لا توجد بيانات</td></tr>`}</tbody></table></div>`;
  }

  function renderNumberWidget(entries){
    const total = entries.reduce((s,e)=>s+e.value,0);
    return `<div class="stat-number">${total.toLocaleString('ar-EG')}</div>`;
  }

  function renderWidgetBody(chartType, entries){
    if(chartType==='pie') return renderPieWidget(entries);
    if(chartType==='bar') return renderBarWidget(entries);
    if(chartType==='table') return renderTableWidget(entries);
    return renderNumberWidget(entries);
  }

    page.innerHTML = `

        <h2>📊 تحليل البيانات</h2>

        state.analyticsFilters[sel.dataset.field] = sel.value; render();

  /* ================================================================
     الرحلات (Trips) و التسكين (Hotels/Rooms) — قسمان مستقلان تمامًا:

     - "التسكين" (renderAccommodationSection): يدير الفنادق والغرف كمخزون
       مستقل بالكامل عن الرحلات. حذف أو تعديل أي رحلة لا يؤثر عليه إطلاقًا.

     - "الرحلات" (renderTripsHub): يدير الرحلات، ويسمح بربط أي عدد من
       الفنادق (المُعرَّفة أصلاً في "التسكين") بكل رحلة عبر جدول ربط مستقل
       trip_hotels — بدون تكرار إنشاء الفندق. نفس الفندق ونفس الغرفة يمكن
       استخدامهما في أكتر من رحلة في نفس الوقت أو في تواريخ مختلفة، لأن
       النزلاء (accom_guests) بقى ليهم tripId يحدد لأي رحلة ينتمي كل نزيل،
       فالسعة والإشغال بيتحسبوا لكل رحلة على حدة وليس على مستوى الغرفة ذاتها.

     - حذف رحلة من "الرحلات" يحذف فقط: سجل الرحلة + روابطها بالفنادق
       (trip_hotels) + نزلاء هذه الرحلة تحديدًا (accom_guests بـ tripId
       بتاعها) — ولا يحذف الفندق أو الغرف نفسها أبدًا مهما حصل.

     - migration تلقائية (ensureAccommodationMigration) بتحافظ على البيانات
       القديمة: أي فندق كان مربوط برحلة واحدة بس (الطريقة القديمة عبر حقل
       tripId داخل الفندق) بييتحول تلقائيًا لرابط trip_hotels، وأي نزيل قديم
       من غير tripId بياخد tripId الرحلة القديمة دي، من غير ما نحذف أو نلمس
       أي بيانات فعلية.
     ================================================================ */

  let accomMigrationChecked = false;
  async function ensureAccommodationMigration(){
    if(accomMigrationChecked) return;
    accomMigrationChecked = true;
    try{
      const flag = await getSetting('accom_migration_v2_done');
      if(flag==='yes') return;
      await getDataMany(['accom_hotels','trip_hotels','accom_rooms','accom_guests']);
      const hotels = await getData('accom_hotels');
      const tripHotels = await getData('trip_hotels');
      const rooms = await getData('accom_rooms');
      const guests = await getData('accom_guests');
      const newLinks = [];
      const guestUpdates = [];
      hotels.forEach(h=>{
        const legacyTripId = h.tripId;
        if(!legacyTripId) return;
        const exists = tripHotels.some(th=>String(th.tripId)===String(legacyTripId) && String(th.hotelId)===String(h.id));
        if(!exists) newLinks.push({id:uid(), tripId:legacyTripId, hotelId:h.id, notes:''});
        const hotelRoomIds = rooms.filter(r=>r.hotelId===h.id).map(r=>r.id);
        guests.forEach(g=>{
          if(hotelRoomIds.includes(g.roomId) && !g.tripId){
            guestUpdates.push({...g, tripId: legacyTripId});
          }
        });
      });
      if(newLinks.length) await apiAddMany('trip_hotels', newLinks);
      if(guestUpdates.length) await apiAddMany('accom_guests', guestUpdates);
      await setSetting('accom_migration_v2_done','yes');
    }catch(e){ console.error('accommodation migration error', e); }
  }

  function crumbsBar(items){
    return `<div class="crumbs">${items.map((it,i)=>{
      const isLast = i===items.length-1;
      const sep = i>0? `<span class="sep">›</span>` : '';
      return sep + (isLast? `<span>${esc(it.label)}</span>` : `<button data-crumb="${i}">${esc(it.label)}</button>`);
    }).join('')}</div>`;
  }
  function bindCrumbs(page, handlers){

  /* ---------------- التسكين: الفنادق والغرف (مستقل تمامًا عن الرحلات) ---------------- */

    await getDataMany(['accom_hotels','accom_rooms']);

            <button class="icon-btn del" data-delhotelstd="${h.id}" style="margin-top:6px;">🗑️ حذف</button>

    if(state.tripsHubView==='hotels') return renderTripHub_HotelsOfTrip(page);

    if(state.tripsHubView==='guests') return renderTripHub_GuestsOfRoom(page);

  async function renderTripHub_HotelsOfTrip(page){
    await getDataMany(['trips','trip_hotels','accom_hotels','accom_rooms','accom_guests']);
    const trips = await getData('trips');
    const trip = trips.find(t=>t.id===state.tripsHubTripId);
    if(!trip){ state.tripsHubView='trips'; return render(); }
    const links = (await getData('trip_hotels')).filter(l=>l.tripId===trip.id);
    const allHotels = await getData('accom_hotels');
    const rooms = await getData('accom_rooms');
    page.innerHTML = `
      <div class="page-head">
        <h2>🏨 فنادق رحلة ${esc(trip.label||'')} — ${esc(trip.date||'')}</h2>

      </div>

      <div class="card">
        ${links.length? `<div class="areas-grid">${links.map(l=>{
          const h = allHotels.find(x=>x.id===l.hotelId);

          const roomsCnt = rooms.filter(r=>r.hotelId===h.id).length;

            <div class="nm" style="color:var(--navy-700);font-weight:700;">${roomsCnt} غرفة</div>
            <button class="icon-btn del" data-unlink="${l.id}" style="margin-top:6px;">✖ إلغاء الربط بالرحلة</button>
          </div>`;
        }).join('')}</div>` : `<div class="empty-state"><div class="big">📭</div>لا يوجد فنادق مرتبطة بهذه الرحلة بعد</div>`}
      </div>`;

          <div class="field full"><label>اختر فندق موجود</label>
            <select name="existingHotel">
              <option value="">— اختر من الفنادق الموجودة —</option>
              ${available.map(h=>`<option value="${esc(h.id)}">${esc(h.name)}${h.location?' — '+esc(h.location):''}</option>`).join('')}
            </select>
          </div>
          <div class="field full" style="text-align:center;color:var(--muted);font-size:13px;">— أو —</div>
          <div class="field full"><label>اسم فندق جديد</label><input name="newHotelName" placeholder="اتركه فارغًا لو هتختار من القائمة"/></div>
          <div class="field full"><label>مكان الفندق الجديد</label><input name="newHotelLocation"/></div>
        </div>
        <div class="modal-actions"><button type="button" class="btn-secondary" id="cancel-btn">إلغاء</button>
          <button type="submit" class="btn-primary btn-gold">ربط بالرحلة</button></div></form></div>`;
      document.body.appendChild(modalBg);
      modalBg.querySelector('#cancel-btn').addEventListener('click', ()=>modalBg.remove());
      modalBg.addEventListener('click', e=>{ if(e.target===modalBg) modalBg.remove(); });
      modalBg.querySelector('#link-hotel-form').addEventListener('submit', async e=>{
        e.preventDefault();
        const guard = submitGuard(e.target); if(!guard.ok) return;
        try{
          const fd = new FormData(e.target);
          let hotelId = fd.get('existingHotel');
          const newName = (fd.get('newHotelName')||'').trim();
          if(!hotelId && !newName){ alert('اختر فندقًا موجودًا أو أدخل اسم فندق جديد'); guard.release(); return; }
          if(!hotelId && newName){
            const newHotel = {id:uid(), name:newName, location:fd.get('newHotelLocation')||'', notes:''};
            await apiAdd('accom_hotels', newHotel);
            hotelId = newHotel.id;
          }
          const alreadyLinked = (await getData('trip_hotels')).some(l=>l.tripId===tripId && l.hotelId===hotelId);
          if(!alreadyLinked){
            await apiAdd('trip_hotels', {id:uid(), tripId, hotelId, notes:''});
          }
          modalBg.remove(); render();
        }catch(err){ console.error(err); alert('تعذر الحفظ'); guard.release(); }
      });
    })();
  }

  /* ---------------- Generic module CRUD renderer ---------------- */
  async function renderModule(page, key){
    const mod = MODULES[key];
    if(!mod || !mod.roles.includes(state.user.role)) return;
    const linkRefs = mod.fields.filter(f=>f.type==='linkSelect').map(f=>f.ref);
    const extraRefs = key==='subscriptions' ? ['indoor_leads'] : [];
    await getDataMany([key, ...((isPRUser()||key==='visits')?['employees']:[]), ...linkRefs, ...extraRefs]);
    const allData = await getData(key);
    let data = await filterPRData(key, allData);

    // تقارير الزيارات: كل تيم يشوف بس زياراته هو (اللي عملها موظفين تيمه)، الأدمن يشوف الكل.
    // لو الموظف مش مربوط بأي تيم، بيشوف زياراته الشخصية بس كإجراء آمن افتراضي.
    if(key==='visits' && state.user.role!=='admin'){
      const emp = await currentEmployeeFresh();
      const myTeam = emp?.team || '';
      if(myTeam){
        const employees = await getData('employees');
        const teamNames = new Set(employees.filter(e=>e.team===myTeam).map(e=>e.name));
        data = data.filter(r=> teamNames.has(r.visitedBy));
      } else {
        const myName = emp?.name || state.user.name;
        data = data.filter(r=> r.visitedBy===myName);
      }
    }

    // بعض الاشتراكات القديمة قد لا تحتوي على leadId.
    // في هذه الحالة نربطها تلقائيًا بالمهتم من خلال رقم الهاتف أو اسم العميل.
    if(key==='subscriptions'){
      const leads = await getData('indoor_leads');
      data = data.map(row=>{
        if(row.leadId) return row;

        const rowPhone = String(row.phone||'').replace(/\D/g,'');
        const rowName = String(row.customerName||'').trim();

        const lead = leads.find(l=>{
          const leadPhone = String(l.phone||'').replace(/\D/g,'');
          const leadName = String(l.name||'').trim();

          const phoneMatch = rowPhone && leadPhone && (
            rowPhone===leadPhone ||
            rowPhone.endsWith(leadPhone.slice(-10)) ||
            leadPhone.endsWith(rowPhone.slice(-10))
          );

          const nameMatch = rowName && leadName && rowName===leadName;

          return phoneMatch || nameMatch;
        });

        if(!lead) return row;

        return {
          ...row,
          leadId: lead.id || '',
          nationalId: row.nationalId || lead.nationalId || ''
        };
      });
    }
    const linkMaps = {};
    mod.fields.filter(f=>f.type==='linkSelect').forEach(f=>{
      const refList = cache[f.ref] || [];
      linkMaps[f.key] = Object.fromEntries(refList.map(r=>[r.id, linkLabel(f.ref, r)]));
    });
    if(key==='subscriptions'){
      const leads = cache['indoor_leads'] || [];
      linkMaps.__leadCodes = Object.fromEntries(leads.map(l=>[l.id, l.code||'']));
    }

    state.moduleSearch = state.moduleSearch || {};
    const searchTerm = state.moduleSearch[key] || '';

    const bindTableEvents = (container, visibleData)=>{
      container.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click', ()=>{
        const row=visibleData.find(r=>String(r.id)===String(b.dataset.edit));
        if(prCanEditRow(key,row)) openForm(key,b.dataset.edit); else alert('ليس لديك صلاحية لتعديل هذه البيانات');
      }));
      container.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click', async ()=>{
        const row=visibleData.find(r=>String(r.id)===String(b.dataset.del));
        if(!prCanEditRow(key,row)){ alert('ليس لديك صلاحية لحذف هذه البيانات'); return; }
        if(!confirm('تأكيد الحذف؟')) return;
        await apiDelete(key,b.dataset.del);
        if(key==='subscriptions'){
          const guests = await getData('accom_guests');
          const linked = guests.find(g=>String(g.subscriptionId||'')===String(b.dataset.del));
          if(linked) await apiDelete('accom_guests', linked.id);
        }
        render();
      }));
    };

    const tableSectionHtml = (visibleData)=>{
      if(!data.length) return `<div class="empty-state"><div class="big">📭</div>لا توجد بيانات بعد — ابدأ بالإضافة</div>`;
      if(!visibleData.length) return `<div class="empty-state"><div class="big">🔍</div>لا توجد نتائج مطابقة للبحث</div>`;
      return `<div class="table-wrap"><table>
          <thead><tr>${mod.fields.map(f=>`<th>${esc(f.label)}</th>`).join('')}<th></th></tr></thead>
          <tbody>${visibleData.map(row=>renderRow(mod,row,linkMaps)).join('')}</tbody>
        </table></div>`;
    };

    page.innerHTML = `
      <div class="page-head">
        <h2>${mod.icon} ${esc(mod.title)}</h2>
        <button class="btn-primary btn-gold" id="add-btn" style="width:auto;padding:10px 20px;">+ إضافة</button>
      </div>
      ${isPRUser() && state.user.role!=='pr_manager' ? `<div class="assumption-note">البيانات المعروضة هنا خاصة بنطاق صلاحيتك. لا يتم عرض بيانات أعضاء العلاقات العامة الآخرين.</div>`:''}
      ${data.length? `<div class="card" style="padding:14px 20px;margin-bottom:14px;">
        <input type="text" id="module-search-input" placeholder="🔍 ابحث في ${esc(mod.title)}..." value="${esc(searchTerm)}"
          style="width:100%;padding:10px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:14px;background:var(--sand-50);"/>
      </div>` : ''}
      <div class="card"><div id="module-table-wrap">${tableSectionHtml(filterModuleRows(mod, data, linkMaps, searchTerm))}</div></div>`;

    document.getElementById('add-btn').addEventListener('click', ()=> key==='employees' ? openEmployeeAccountForm() : openForm(key, null));

    let currentVisible = filterModuleRows(mod, data, linkMaps, searchTerm);
    bindTableEvents(document.getElementById('module-table-wrap'), currentVisible);

    const searchInput = document.getElementById('module-search-input');
    if(searchInput){
      searchInput.addEventListener('input', ()=>{
        state.moduleSearch[key] = searchInput.value;
        currentVisible = filterModuleRows(mod, data, linkMaps, searchInput.value);
        const wrap = document.getElementById('module-table-wrap');
        wrap.innerHTML = tableSectionHtml(currentVisible);
        bindTableEvents(wrap, currentVisible);
      });
    }
  }

  // نص قابل للبحث فيه لكل صف: بيحوّل القيم المرتبطة (linkSelect/كود العميل) لنصها
  // الظاهر للمستخدم بدل الـ id الداخلي، عشان البحث يشتغل بالاسم اللي المستخدم شايفه فعليًا.
  function rowSearchText(mod, row, linkMaps){
    const parts = mod.fields.map(f=>{
      const v = row[f.key];
      if(f.key==='leadId'){
        const code = linkMaps && linkMaps.__leadCodes && linkMaps.__leadCodes[v];
        return code || v || '';
      }
      if(f.type==='linkSelect'){
        const label = linkMaps && linkMaps[f.key] && linkMaps[f.key][v];
        return label || v || '';
      }
      if(f.type==='image') return '';
      return v==null? '' : String(v);
    });
    return parts.join(' ').toLowerCase();
  }
  function filterModuleRows(mod, data, linkMaps, searchTerm){
    const term = (searchTerm||'').trim().toLowerCase();
    if(!term) return data;
    return data.filter(r=> rowSearchText(mod, r, linkMaps).includes(term));
  }

  function fieldDisplay(f, val, linkMaps, row){
    // في الاشتراكات: نعرض كود العميل الثابت المرتبط بالمهتم لو موجود،
    // وإلا نرجع للعرض القديم (توافقًا مع السجلات القديمة قبل إضافة الكود).
    if(f.key==='leadId'){
      const leadId = String(row?.leadId || val || '').trim();
      if(!leadId) return '';
      const code = linkMaps && linkMaps.__leadCodes && linkMaps.__leadCodes[leadId];
      if(code) return esc(code);

      const nationalId = String(row?.nationalId || '').replace(/\D/g,'');
      const phone = String(row?.phone || '').replace(/\D/g,'');
      const nationalPart = nationalId.slice(0,4);
      const phonePart = phone.slice(-2);
      const parts = [leadId];
      if(nationalPart) parts.push(nationalPart);
      if(phonePart) parts.push(phonePart);
      return esc(parts.join(' - '));
    }

    if(f.type==='image'){
      return val? `<img class="row-photo" src="${val}"/>` : `<div class="row-photo"></div>`;
    }
    if(f.type==='linkSelect'){
      if(!val) return '';
      const label = linkMaps && linkMaps[f.key] && linkMaps[f.key][val];
      return esc(label || val);
    }
    if(f.key==='status' || f.key==='flightStatus' || f.key==='paymentStatus'){
      const map = {'تم التواصل':'blue','تم تحديد معاد':'gold','تم الرفض':'red','تحت التفاوض':'gold',
        'لم يتم التوصل لأي شيء':'gray','لم تتم الزيارة':'gray','مكتمل':'green','جاري السداد':'gold','متأخر':'red',
        'تم الحجز':'green','لم يُحجز':'gray','جديد':'blue','تحويل لحجز':'green'};
      const cls = map[val] || 'gray';
      return val? `<span class="badge ${cls}">${esc(val)}</span>` : '';
    }
    return esc(val);
  }

  function renderRow(mod, row, linkMaps){
    return `<tr>${mod.fields.map(f=>`<td>${fieldDisplay(f,row[f.key],linkMaps,row)}</td>`).join('')}
      <td style="white-space:nowrap;">
        <button class="icon-btn" data-edit="${row.id}">✏️</button>
        <button class="icon-btn del" data-del="${row.id}">🗑️</button>
      </td></tr>`;
  }

        <div class="field"><label>القسم</label><select name="department"><option value="">اختر...</option>${Object.values(ROLE_LABELS).map(v=>`<option>${esc(v)}</option>`).join('')}</select></div>
        <div class="field"><label>الرقم الخاص</label><input name="specialNumber" /></div>
        <div class="field"><label>رقم الشركة</label><input name="companyNumber" /></div>
        <div class="field"><label>رقم الهاتف</label><input name="phone" /></div>
        <div class="field"><label>العنوان</label><input name="address" /></div>
        <div class="field"><label>تاريخ التعيين</label><input name="hireDate" type="date" /></div>
        <div class="field"><label>الراتب</label><input name="salary" type="number" /></div>
        <div class="field full"><label>الفريق</label><select name="team"><option value="">بدون فريق</option></select></div>
      </div>
      <div class="modal-actions"><button type="button" class="btn-secondary" id="cancel-btn">إلغاء</button><button type="submit" class="btn-primary btn-gold">إنشاء الحساب والموظف</button></div>
      </form></div>`;
    document.body.appendChild(modalBg);
    const teams = await getData('teams');
    const teamSel = modalBg.querySelector('[name="team"]');
    teamSel.innerHTML = '<option value="">بدون فريق</option>' + teams.map(t=>`<option value="${esc(t.name)}">${esc(t.name)}</option>`).join('');
    modalBg.querySelector('#cancel-btn').addEventListener('click', ()=>modalBg.remove());
    modalBg.addEventListener('click', e=>{if(e.target===modalBg) modalBg.remove();});
    modalBg.querySelector('#employee-account-form').addEventListener('submit', async e=>{
      e.preventDefault();
      const form=e.target, btn=form.querySelector('button[type=submit]');
      const password=form.password.value, password2=form.password2.value;
      if(password!==password2){ alert('تأكيد كلمة المرور غير مطابق'); return; }
      btn.disabled=true; btn.textContent='جارٍ إنشاء الحساب...';
      try{
        const payload={
          name:form.name.value.trim(), username:form.username.value.trim().toLowerCase(), password,
          role:form.role.value,
          employeeData:{specialNumber:form.specialNumber.value, companyNumber:form.companyNumber.value, department:form.department.value,
            team:form.team.value, phone:form.phone.value, address:form.address.value, hireDate:form.hireDate.value||null,
            salary:form.salary.value?Number(form.salary.value):null}
        };
        if(!payload.name || !payload.username || !payload.password || !payload.role) throw new Error('أكمل البيانات المطلوبة');
        const users=await loadList('users');
        if(users.some(x=>String(x.username||'').toLowerCase()===payload.username)) throw new Error('اسم المستخدم مستخدم بالفعل');
        const employeeId=uid();
        const user={id:uid(),name:payload.name,username:payload.username,passwordHash:await sha256(payload.password),role:payload.role,status:'active',
          team:payload.employeeData.team||'',employeeId};
        const employee={id:employeeId,name:payload.name,username:payload.username,department:payload.employeeData.department||ROLE_LABELS[payload.role]||'',status:'active',...payload.employeeData};
        await Promise.all([apiAdd('users',user), apiAdd('employees',employee)]);
        modalBg.remove(); render();
      }catch(err){
        console.error(err); alert(err.message || 'فشل إنشاء حساب الموظف'); btn.disabled=false; btn.textContent='إنشاء الحساب والموظف';
      }
    });
  }

  /** أي موظف مسجّل دخوله يقدر يغيّر اسم المستخدم و/أو كلمة المرور بتاعته من هنا */
  function openChangeAccountForm(){
    const modalBg = document.createElement('div');
    modalBg.className = 'modal-bg';
    modalBg.innerHTML = `<div class="modal">
      <h3>تغيير بيانات الدخول</h3>
      <div class="assumption-note">سيبها فاضية لو مش عايز تغيّرها. لازم تدخل كلمة المرور الحالية للتأكيد.</div>
      <form id="change-account-form"><div class="form-grid">
        <div class="field"><label>اسم المستخدم الجديد (اختياري)</label><input name="newUsername" pattern="[a-zA-Z0-9._-]{3,40}" placeholder="سيبها فاضية لو مش هتغيّر" /></div>
        <div class="field"><label>كلمة المرور الجديدة (اختياري)</label><input name="newPassword" type="password" minlength="8" placeholder="8 أحرف على الأقل" /></div>
        <div class="field full"><label>كلمة المرور الحالية *</label><input name="currentPassword" type="password" required /></div>
      </div>
      <div class="modal-actions"><button type="button" class="btn-secondary" id="cancel-btn">إلغاء</button><button type="submit" class="btn-primary btn-gold">حفظ</button></div>
      </form></div>`;
    document.body.appendChild(modalBg);
    modalBg.querySelector('#cancel-btn').addEventListener('click', ()=>modalBg.remove());
    modalBg.addEventListener('click', e=>{if(e.target===modalBg) modalBg.remove();});
    modalBg.querySelector('#change-account-form').addEventListener('submit', async e=>{
      e.preventDefault();
      const form=e.target, btn=form.querySelector('button[type=submit]');
      const newUsername = form.newUsername.value.trim();
      const newPassword = form.newPassword.value;
      const currentPassword = form.currentPassword.value;
      if(!newUsername && !newPassword){ alert('حدد اسم مستخدم جديد أو كلمة مرور جديدة على الأقل'); return; }
      btn.disabled=true; btn.textContent='جارٍ الحفظ...';
      try{
        const users=await loadList('users');
        const idx=users.findIndex(x=>x.id===state.user.id);
        if(idx<0) throw new Error('لم يتم العثور على الحساب');
        if(users[idx].passwordHash!==await sha256(currentPassword)) throw new Error('كلمة المرور الحالية غير صحيحة');
        if(newUsername && users.some(x=>x.id!==state.user.id && String(x.username||'').toLowerCase()===newUsername.toLowerCase())) throw new Error('اسم المستخدم مستخدم بالفعل');
        if(newUsername) users[idx].username=newUsername.toLowerCase();
        if(newPassword) users[idx].passwordHash=await sha256(newPassword);
        await apiUpdate('users',users[idx]);
        state.user=users[idx]; localStorage.setItem('homsa_session_user',JSON.stringify(state.user));
        alert('تم تحديث بيانات الدخول بنجاح.' + (newUsername? ' اسم المستخدم الجديد: '+users[idx].username : ''));
        modalBg.remove(); render();
      }catch(err){
        console.error(err); alert(err.message || 'فشل تحديث بيانات الدخول'); btn.disabled=false; btn.textContent='حفظ';
      }
    });
  }

  async function openForm(key, id){
    const mod = MODULES[key];
    if(!mod || !mod.roles.includes(state.user.role)) return;
    const refKeys = mod.fields.filter(f=>f.type==='dynamicSelect'||f.type==='linkSelect').map(f=>f.ref);
    if(key==='subscriptions') refKeys.push('trip_hotels');
    await getDataMany([key, 'employees', ...refKeys]);
    const list = await getData(key);
    const row = id? list.find(r=>r.id===id) : {};
    if(id && !prCanEditRow(key,row)){ alert('ليس لديك صلاحية لتعديل هذه البيانات'); return; }
    let refOptions = {};
    for(const f of mod.fields){
      if(f.type==='dynamicSelect'){
        let refList = await getData(f.ref);
        if(f.filter) refList = refList.filter(r=> r[f.filter.field]===f.filter.value);
        if(isPRUser() && ['pr_manager','pr_leader','pr_member'].includes(state.user.role) && f.ref==='employees'){
          if(state.user.role==='pr_manager') {}
          else {
            const names=await prAllowedNames();
            refList=refList.filter(r=>names.has(r.name));
          }
        }
        // تقارير الزيارات: كل تيم يشوف ويسجّل بس على موظفي تيمه هو، الأدمن يشوف الكل
        if(key==='visits' && f.key==='visitedBy' && state.user.role!=='admin'){
          const emp = await currentEmployeeFresh();
          const myTeam = emp?.team || '';
          refList = myTeam ? refList.filter(r=>r.team===myTeam) : refList.filter(r=>r.name===(emp?.name||state.user.name));
        }
        refOptions[f.key] = refList.map(r=>r[f.refField]);
      } else if(f.type==='linkSelect'){
        const parentVal = f.parentKey ? (row? (row[f.parentKey]||'') : '') : null;
        refOptions[f.key] = await linkSelectOptionsFor(key, f, parentVal);
      }
    }

    const modalBg = document.createElement('div');
    modalBg.className = 'modal-bg';
    modalBg.innerHTML = `<div class="modal">
      <h3>${id? 'تعديل بيانات':'إضافة جديد'} — ${esc(mod.title)}</h3>
      <form id="mod-form"><div class="form-grid">
        ${mod.fields.map(f=>renderField(f, row, refOptions)).join('')}
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="cancel-btn">إلغاء</button>
        <button type="submit" class="btn-primary btn-gold">حفظ</button>
      </div></form>
    </div>`;
    document.body.appendChild(modalBg);

    const cascadeFields = mod.fields.filter(f=>f.type==='linkSelect' && f.parentKey);
    if(cascadeFields.length){
      const fillOptions = async (field, parentVal)=>{
        const sel = modalBg.querySelector(`[name="${field.key}"]`);
        if(!sel) return;
        const list = await linkSelectOptionsFor(key, field, parentVal);
        sel.innerHTML = `<option value="">— بدون —</option>` + list.map(o=>`<option value="${esc(o.id)}">${esc(o.label)}</option>`).join('');
      };
      cascadeFields.forEach(f=>{
        const parentSel = modalBg.querySelector(`[name="${f.parentKey}"]`);
        if(!parentSel) return;
        parentSel.addEventListener('change', async ()=>{
          await fillOptions(f, parentSel.value);
          const grandChild = cascadeFields.find(gc=>gc.parentKey===f.key);
          if(grandChild){
            const gcSel = modalBg.querySelector(`[name="${grandChild.key}"]`);
            if(gcSel) gcSel.innerHTML = `<option value="">— بدون —</option>`;
          }
        });
      });
    }

    modalBg.querySelector('#cancel-btn').addEventListener('click', ()=>modalBg.remove());
    modalBg.addEventListener('click', e=>{ if(e.target===modalBg) modalBg.remove(); });

    const imgInput = modalBg.querySelector('input[type=file]');
    if(imgInput){
      imgInput.addEventListener('change', ()=>{
        const file = imgInput.files[0]; if(!file) return;
        const reader = new FileReader();
        reader.onload = ()=>{ imgInput.dataset.value = reader.result;
          const prev = modalBg.querySelector('.photo-preview'); if(prev) prev.src = reader.result; };
        reader.readAsDataURL(file);
      });
    }

    modalBg.querySelector('#mod-form').addEventListener('submit', async e=>{
      e.preventDefault();
      // منع الحفظ المتكرر (دبل كليك) اللي كان بيعمل نسخ مكررة من نفس السجل
      const guard = submitGuard(e.target); if(!guard.ok) return;
      try{
        const isNew = !row.id;
        const newRow = row.id? {...row} : {id: uid()};
        for(const f of mod.fields){
          if(f.type==='readonly') continue;
          if(f.type==='image'){ newRow[f.key] = imgInput.dataset.value || row[f.key] || ''; continue; }
          const el = modalBg.querySelector(`[name="${f.key}"]`);
          if(el) newRow[f.key] = el.value;
        }

        // كود العميل: يُنشأ مرة واحدة فقط عند أول تسجيل لمهتم/مندوب جديد
        if(key==='indoor_leads' && isNew && !newRow.code){
          newRow.code = generateCustomerCode(newRow.phone);
        }

        /* عضو العلاقات العامة لا يستطيع إنشاء سجل باسم عضو آخر */
        if(isPRUser() && state.user.role==='pr_member'){
          const me=await currentEmployeeFresh(), myName=me?.name||state.user.name;
          if(['indoor_leads','indoor_data','subscriptions'].includes(key)) newRow.responsiblePerson=myName;
          if(key==='pr_member_data') newRow.memberId=myName;
        }
        if(isPRUser() && state.user.role==='pr_leader'){
          const names=await prAllowedNames();
          if(['indoor_leads','indoor_data','subscriptions'].includes(key) && newRow.responsiblePerson && !names.has(newRow.responsiblePerson))
            throw new Error('لا يمكن ربط البيانات بعضو خارج فريقك');
          if(key==='pr_member_data' && newRow.memberId && !names.has(newRow.memberId))
            throw new Error('لا يمكن ربط الداتا بعضو خارج فريقك');
        }

        if(isNew) await apiAdd(key, newRow); else await apiUpdate(key, newRow);
        if(key==='indoor_leads') await maybeCreateSubscriptionFromLead(newRow);
        if(key==='subscriptions') await syncSubscriptionGuest(newRow);
        modalBg.remove();
        render();
      }catch(err){
        console.error(err);
        alert(err.message || 'تعذر حفظ البيانات');
        guard.release();
      }
    });
  }

  function renderField(f, row, refOptions){
    const val = row? (row[f.key]||'') : '';
    const full = (f.type==='textarea'||f.type==='image') ? 'full':'';
    let inner = '';
    if(f.type==='select'){
      inner = `<select name="${f.key}" ${f.required?'required':''}><option value="">اختر...</option>
        ${f.options.map(o=>`<option value="${esc(o)}" ${o===val?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
    } else if(f.type==='dynamicSelect'){
      const opts = refOptions[f.key]||[];
      inner = `<select name="${f.key}" ${f.required?'required':''}><option value="">اختر...</option>
        ${opts.map(o=>`<option value="${esc(o)}" ${o===val?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
    } else if(f.type==='linkSelect'){
      const opts = refOptions[f.key]||[];
      inner = `<select name="${f.key}" data-linkselect="${f.key}"${f.parentKey?` data-parent-key="${f.parentKey}"`:''}>
        <option value="">— بدون —</option>
        ${opts.map(o=>`<option value="${esc(o.id)}" ${String(o.id)===String(val)?'selected':''}>${esc(o.label)}</option>`).join('')}
      </select>`;
    } else if(f.type==='textarea'){
      inner = `<textarea name="${f.key}" rows="3">${esc(val)}</textarea>`;
    } else if(f.type==='image'){
      inner = `${val?`<img class="photo-preview" src="${val}"/>`:''}<input type="file" accept="image/*" name="${f.key}"/>`;
    } else if(f.type==='readonly'){
      inner = `<input type="text" name="${f.key}" value="${esc(val)}" readonly style="background:#eee;cursor:not-allowed"/>`;
    } else {

      inner = `<input type="${f.type}" name="${f.key}" value="${esc(val)}" ${f.required?'required':''}/>`;
    }
    return `<div class="field ${full}"><label>${esc(f.label)}</label>${inner}</div>`;
  }

  (function initAuth(){
    // بنعرض الشاشة فورًا ببيانات الجلسة المحفوظة محليًا من غير ما ننتظر رد السيرفر،
    // عشان فتح التطبيق يحس إنه سريع جدًا، وبعدين بنتأكد من صلاحية الجلسة في الخلفية.
    try{
      const saved=localStorage.getItem('homsa_session_user');
      HOMSA_SESSION=localStorage.getItem('homsa_session_token') || '';
      if(saved && HOMSA_SESSION){
        try{ state.user = JSON.parse(saved); }catch(_){ state.user=null; }
      }
    }catch(e){ console.error('Init error', e); }

    render();

    if(state.user && HOMSA_SESSION){
      (async function verifySessionInBackground(){
        try{
          const u=new URL(GOOGLE_SHEETS_WEBHOOK);
          u.searchParams.set('action','me');
          u.searchParams.set('session',HOMSA_SESSION);
          const r=await fetch(u.toString(),{cache:'no-store'});
          const data=await r.json();
          if(data.ok){
            state.user=data.user;
            localStorage.setItem('homsa_session_user', JSON.stringify(data.user));
          } else {
            localStorage.removeItem('homsa_session_user'); localStorage.removeItem('homsa_session_token');
            HOMSA_SESSION=''; state.user=null; render();
          }
        }catch(e){ console.error('Session check error', e); }
      })();
    }
  })();
})();
</script>
