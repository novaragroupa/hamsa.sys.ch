<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام إدارة همسة للسياحة</title>
</head>
<body>
<div id="app-root"></div>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Amiri:wght@400;700&display=swap');

  :root{
    --navy-900:#0c1f3d;
    --navy-800:#14315c;
    --navy-700:#1b3a6b;
    --navy-600:#25508f;
    --gold-500:#f2b705;
    --gold-600:#c99a03;
    --sand-50:#faf7f0;
    --sand-100:#f1ead8;
    --ink:#14213d;
    --line:#e3ddce;
    --muted:#6b7280;
    --danger:#b3261e;
    --success:#1a7a4c;
    --warn:#a5690a;
    --navy-950:#081226;
    --gold-300:#f8d878;
  }
  *{box-sizing:border-box;}
  #app-root, #app-root *{font-family:'Cairo',sans-serif;}
  #app-root{direction:rtl;color:var(--ink);background:var(--sand-50);min-height:100vh;}
  #app-root button{font-family:inherit;cursor:pointer;border:none;}
  #app-root input, #app-root select, #app-root textarea{font-family:inherit;}

  /* ---------- Login ---------- */
  /* اتعمل التصميم على شكل بوابة على اتنين: يمين مشهد "الأرشيف/المحراب" بلون
     النظام الأساسي (كحلي/دهبي) نفس هوية اللوجو، وشمال فورم الدخول على خلفية
     رملية هادية. القوس اللي في اللوجو اتحول لعنصر بصري متكرر (Hero) بدل ما
     يفضل مجرد لوجو صغير فوق كارت أبيض عادي. */
  .login-screen{min-height:100vh;display:flex;background:var(--navy-950);}
  .login-hero{position:relative;flex:1 1 56%;min-height:34vh;overflow:hidden;
    background:radial-gradient(ellipse at 32% 16%, var(--navy-700) 0%, var(--navy-900) 55%, var(--navy-950) 100%);
    display:flex;align-items:center;justify-content:center;padding:48px 32px;}
  .hero-pattern{position:absolute;inset:0;pointer-events:none;
    background-image:
      repeating-linear-gradient(45deg, rgba(242,183,5,.08) 0 1px, transparent 1px 48px),
      repeating-linear-gradient(-45deg, rgba(242,183,5,.08) 0 1px, transparent 1px 48px);
    -webkit-mask-image:radial-gradient(ellipse at 50% 42%, #000 0%, transparent 76%);
            mask-image:radial-gradient(ellipse at 50% 42%, #000 0%, transparent 76%);}
  .hero-content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;
    text-align:center;animation:heroIn .9s cubic-bezier(.16,1,.3,1) both;}
  @keyframes heroIn{from{opacity:0;transform:translateY(14px) scale(.98);}to{opacity:1;transform:none;}}
  .hero-icon-wrap{position:relative;margin-bottom:24px;display:flex;align-items:center;justify-content:center;}
  .hero-icon-wrap::before{content:"";position:absolute;width:220px;height:220px;border-radius:50%;
    background:radial-gradient(circle, rgba(242,183,5,.28), transparent 68%);filter:blur(6px);}
  .hero-icon-wrap img{position:relative;height:clamp(190px,24vw,270px);
    filter:drop-shadow(0 16px 30px rgba(0,0,0,.5));}
  .hero-title{font-family:'Amiri',serif;color:#fff;font-size:clamp(21px,2.4vw,27px);font-weight:700;margin:0 0 12px;}
  .hero-divider{width:48px;height:2px;background:var(--gold-500);margin:0 0 18px;opacity:.75;}
  .hero-tagline{font-family:'Amiri',serif;color:var(--gold-300);font-size:clamp(14.5px,1.5vw,16.5px);
    margin:0;max-width:320px;line-height:1.95;}

  .login-panel{flex:1 1 44%;display:flex;align-items:center;justify-content:center;
    background:var(--sand-50);padding:48px 28px;}
  .login-panel-inner{width:100%;max-width:340px;animation:panelIn .9s .15s cubic-bezier(.16,1,.3,1) both;}
  @keyframes panelIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  .login-panel-inner h1{font-size:23px;font-weight:800;color:var(--navy-900);margin:0 0 6px;}
  .login-panel-inner p.sub{color:var(--muted);font-size:13.5px;margin:0 0 30px;line-height:1.7;}
  .login-field{margin-bottom:22px;}
  .login-field label{display:block;font-size:12.5px;font-weight:700;color:var(--navy-700);margin-bottom:8px;}
  .login-field .input-line{position:relative;}
  .login-field .input-line::after{content:"";position:absolute;right:0;bottom:-1.5px;width:0;height:2px;
    background:var(--gold-500);transition:width .25s ease;}
  .login-field .input-line:focus-within::after{width:100%;}
  .login-field input{width:100%;padding:9px 2px;border:none;border-bottom:1.5px solid var(--line);
    background:transparent;font-size:15px;color:var(--ink);}
  .login-field input:focus{outline:none;}
  .login-submit{width:100%;padding:13px;margin-top:10px;background:var(--navy-900);color:#fff;
    border-radius:10px;font-weight:700;font-size:15px;transition:background .15s, transform .08s;}
  .login-submit:hover{background:var(--gold-500);color:var(--navy-900);}
  .login-submit:active{transform:scale(.98);}
  .login-submit:focus-visible{outline:2px solid var(--gold-500);outline-offset:2px;}
  .login-foot{text-align:center;font-size:12px;color:var(--muted);margin-top:28px;}
  @media (max-width:820px){
    .login-screen{flex-direction:column;}
    .login-hero{min-height:30vh;padding:34px 24px;}
    .hero-icon-wrap img{height:140px;}
    .hero-tagline{display:none;}
    .login-panel{padding:36px 22px 52px;}
  }
  @media (prefers-reduced-motion:reduce){
    .hero-content,.login-panel-inner{animation:none;}
  }
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--navy-800);}
  .field input, .field select, .field textarea{width:100%;padding:11px 14px;border:1.5px solid var(--line);
    border-radius:10px;font-size:14px;background:var(--sand-50);transition:.15s;}
  .field input:focus, .field select:focus, .field textarea:focus{outline:none;border-color:var(--gold-500);
    background:#fff;}
  .btn-primary{width:100%;padding:12px;background:var(--navy-800);color:#fff;border-radius:10px;
    font-weight:700;font-size:15px;transition:.15s;}
  .btn-primary:hover{background:var(--navy-900);}
  .btn-gold{background:var(--gold-500);color:var(--navy-900);}
  .btn-gold:hover{background:var(--gold-600);}
  .error-box{background:#fdeceb;color:var(--danger);padding:10px 14px;border-radius:8px;font-size:13px;
    margin-bottom:20px;text-align:center;border-right:3px solid var(--danger);}

  /* ---------- Shell ---------- */
  .shell{display:flex;min-height:100vh;}
  .sidebar{width:264px;background:linear-gradient(180deg,var(--navy-900),var(--navy-950));color:#fff;
    display:flex;flex-direction:column;flex-shrink:0;box-shadow:2px 0 22px rgba(8,18,38,.25);}
  .sidebar-head{padding:22px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.08);}
  .sidebar-head img{height:34px;background:#fff;border-radius:8px;padding:3px 5px;}
  .sidebar-head span{font-weight:800;font-size:15px;letter-spacing:.2px;}
  .nav{flex:1;overflow-y:auto;padding:16px 12px;}
  .nav-section+.nav-section{margin-top:20px;padding-top:16px;border-top:1px solid rgba(255,255,255,.06);}
  .nav-section-label{font-size:11px;color:#8fa1c4;font-weight:700;padding:0 10px 9px;letter-spacing:.2px;}
  .nav-item{display:flex;align-items:center;gap:11px;padding:10px 14px;border-radius:10px;color:#cbd6ea;
    font-size:13.5px;font-weight:600;margin-bottom:3px;transition:background .15s,color .15s;background:transparent;width:100%;text-align:right;}
  .nav-item:hover{background:rgba(255,255,255,.08);color:#fff;}
  .nav-item.active{background:var(--gold-500);color:var(--navy-900);box-shadow:0 4px 12px rgba(242,183,5,.28);}
  .sidebar-foot{padding:16px;border-top:1px solid rgba(255,255,255,.08);}
  .user-chip{display:flex;align-items:center;gap:9px;margin-bottom:12px;}
  .avatar{width:36px;height:36px;border-radius:50%;background:var(--gold-500);color:var(--navy-900);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0;
    box-shadow:0 0 0 2px rgba(255,255,255,.15);}
  .user-chip div .name{font-size:13px;font-weight:700;color:#fff;}
  .user-chip div .role{font-size:11px;color:#96a6c4;}
  .logout-btn{width:100%;padding:9px;background:rgba(255,255,255,.07);color:#fff;border-radius:9px;font-size:12.5px;font-weight:600;}
  .logout-btn:hover{background:rgba(255,255,255,.15);}

  .main{flex:1;min-width:0;padding:30px 36px;overflow-y:auto;}
  .page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;padding-bottom:18px;
    border-bottom:1px solid var(--line);flex-wrap:wrap;gap:14px;}
  .page-head h2{font-size:21px;font-weight:800;color:var(--navy-900);margin:0;display:flex;align-items:center;gap:10px;}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:26px;}
  .stat-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;position:relative;overflow:hidden;
    box-shadow:0 1px 2px rgba(12,31,61,.04);}
  .stat-card::before{content:"";position:absolute;top:-30px;left:-30px;width:90px;height:90px;border-radius:50%;
    background:radial-gradient(circle, rgba(242,183,5,.16), transparent 70%);}
  .stat-card .num{font-size:28px;font-weight:800;color:var(--navy-900);position:relative;}
  .stat-card .lbl{font-size:12.5px;color:var(--muted);margin-top:5px;position:relative;}

  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:22px;
    box-shadow:0 1px 2px rgba(12,31,61,.03);}
  .card h3{margin:0 0 16px;font-size:14.5px;font-weight:800;color:var(--navy-900);display:flex;align-items:center;gap:8px;
    padding-inline-start:11px;border-inline-start:3px solid var(--gold-500);}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{text-align:right;padding:11px 12px;color:#fff;font-weight:700;background:var(--navy-800);white-space:nowrap;}
  thead tr:first-child th:first-child{border-top-right-radius:9px;}
  thead tr:first-child th:last-child{border-top-left-radius:9px;}
  tbody td{padding:11px 12px;border-bottom:1px solid var(--sand-100);vertical-align:middle;}
  tbody tr:nth-child(even){background:rgba(20,49,92,.025);}
  tbody tr:hover{background:#fdf6e3;}
  .table-wrap{overflow-x:auto;border-radius:10px;}
  .row-photo{width:32px;height:32px;border-radius:50%;object-fit:cover;background:var(--sand-100);}
  .badge{display:inline-block;padding:3px 11px;border-radius:20px;font-size:11.5px;font-weight:700;}
  .badge.gray{background:#eef0f3;color:#555;}
  .badge.green{background:#e5f5ec;color:var(--success);}
  .badge.red{background:#fdeceb;color:var(--danger);}
  .badge.gold{background:#fff3d1;color:var(--warn);}
  .badge.blue{background:#e6eefc;color:var(--navy-700);}

  .icon-btn{background:transparent;color:var(--navy-700);font-size:13px;padding:6px 9px;border-radius:7px;font-weight:600;}
  .icon-btn:hover{background:var(--sand-100);}
  .icon-btn.del{color:var(--danger);}

  .empty-state{text-align:center;padding:44px 20px;color:var(--muted);}
  .empty-state .big{font-size:36px;margin-bottom:10px;}

  /* modal */
  .modal-bg{position:fixed;inset:0;background:rgba(12,20,38,.55);display:flex;align-items:center;justify-content:center;
    z-index:50;padding:20px;}
  .modal{background:#fff;border-radius:18px;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;padding:26px;
    box-shadow:0 20px 60px rgba(8,18,38,.35);}
  .modal h3{margin:-26px -26px 20px;padding:20px 26px 16px;font-size:17px;font-weight:800;color:var(--navy-900);
    background:linear-gradient(180deg,#fff,var(--sand-50));border-bottom:1px solid var(--line);border-radius:18px 18px 0 0;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .form-grid .full{grid-column:1/-1;}
  .modal-actions{display:flex;gap:10px;margin-top:20px;}
  .btn-secondary{flex:1;padding:11px;background:var(--sand-100);color:var(--navy-800);border-radius:10px;font-weight:700;font-size:14px;}
  .btn-secondary:hover{background:var(--line);}
  .modal-actions .btn-primary{flex:1;}
  .photo-preview{width:64px;height:64px;border-radius:50%;object-fit:cover;background:var(--sand-100);margin-bottom:8px;display:block;}

  .hub-choice-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px;}
  @media (max-width:700px){.hub-choice-grid{grid-template-columns:1fr;}}
  .hub-choice-card{background:#fff;border:1.5px solid var(--line);border-radius:22px;padding:52px 24px;
    text-align:center;transition:.18s;}
  .hub-choice-card:hover{border-color:var(--gold-500);box-shadow:0 14px 32px rgba(12,31,61,.14);transform:translateY(-3px);}
  .hub-choice-icon{font-size:52px;margin-bottom:16px;line-height:1;}
  .hub-choice-title{font-size:21px;font-weight:800;color:var(--navy-900);}
  .hub-choice-count{font-size:14px;color:var(--navy-700);font-weight:700;margin-top:10px;}

  .areas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;}
  .area-chip{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center;transition:border-color .15s;}
  .area-chip .cnt{font-size:22px;font-weight:800;color:var(--navy-800);}
  .area-chip .nm{font-size:12.5px;color:var(--muted);margin-top:4px;}
  .click-card:hover{border-color:var(--gold-500);}

  .split-two{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  @media (max-width:900px){.split-two{grid-template-columns:1fr;} .form-grid{grid-template-columns:1fr;}}
  @media (max-width:760px){.sidebar{position:fixed;right:0;top:0;bottom:0;z-index:40;transform:translateX(100%);transition:.2s;}
    .sidebar.open{transform:translateX(0);} .main{padding:18px;} .menu-toggle{display:inline-flex !important;}}
  .menu-toggle{display:none;background:var(--navy-900);color:#fff;padding:8px 10px;border-radius:8px;font-size:16px;}
  .assumption-note{background:#fff8e6;border:1px solid #f0d98a;color:var(--warn);font-size:12.5px;padding:12px 16px;
    border-radius:12px;margin-bottom:20px;line-height:1.7;border-inline-start:3px solid var(--gold-500);}

  /* ---------------- Analytics / لوحات تحليل البيانات ---------------- */
  .board-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
  .board-tab{padding:9px 16px;border-radius:20px;background:#fff;border:1.5px solid var(--line);color:var(--navy-800);
    font-size:13px;font-weight:700;}
  .board-tab.active{background:var(--navy-800);color:#fff;border-color:var(--navy-800);}
  .analytics-filterbar{display:flex;gap:10px;flex-wrap:wrap;flex:1;}
  .analytics-filter{padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:13px;background:#fff;
    color:var(--navy-800);min-width:140px;}
  .widgets-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;}
  .widget-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;text-align:right;}
  .widget-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px;}
  .widget-head h4{margin:0;font-size:14px;font-weight:800;color:var(--navy-900);}
  .add-widget-card{display:flex;align-items:center;justify-content:center;flex-direction:column;background:var(--sand-100);
    border:1.5px dashed var(--gold-500);color:var(--gold-600);font-weight:700;font-size:13.5px;min-height:120px;
    text-align:center;line-height:1.9;}
  .add-widget-card:hover{background:#fff3d1;}
  .pie-wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
  .pie-donut-wrap{position:relative;width:120px;height:120px;flex-shrink:0;}
  .pie-donut{width:100%;height:100%;border-radius:50%;}
  .pie-hole{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:56px;height:56px;
    border-radius:50%;background:#fff;}
  .pie-legend{flex:1;min-width:140px;}
  .legend-row{display:flex;align-items:center;gap:8px;font-size:12.5px;margin-bottom:6px;}
  .legend-row .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  .legend-row .legend-lbl{flex:1;color:var(--ink);}
  .legend-row .legend-val{color:var(--muted);font-weight:700;white-space:nowrap;}
  .bar-wrap{display:flex;flex-direction:column;gap:10px;}
  .bar-row{display:flex;align-items:center;gap:10px;font-size:12.5px;}
  .bar-lbl{width:90px;flex-shrink:0;color:var(--navy-800);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bar-track{flex:1;height:16px;background:var(--sand-100);border-radius:8px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:8px;}
  .bar-val{width:34px;text-align:left;font-weight:700;color:var(--navy-900);}
  .stat-number{font-size:44px;font-weight:800;color:var(--navy-900);text-align:center;padding:20px 0;}
  .empty-mini{color:var(--muted);font-size:12.5px;text-align:center;padding:20px 0;}

  /* ---------------- الإسكان (Trips -> Hotels -> Rooms -> Guests) ---------------- */
  .crumbs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:18px;font-size:13px;color:var(--navy-800);
    background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;width:fit-content;}
  .crumbs button{background:transparent;color:var(--navy-700);font-weight:700;padding:4px 8px;border-radius:6px;}
  .crumbs button:hover{background:var(--sand-100);}
  .crumbs .sep{color:var(--muted);}
  .click-card{cursor:pointer;transition:.15s;}
  .click-card:hover{box-shadow:0 6px 16px rgba(12,31,61,.12);transform:translateY(-2px);}
  .progress-track{height:8px;background:var(--sand-100);border-radius:6px;overflow:hidden;margin-top:8px;}
  .progress-fill{height:100%;border-radius:6px;background:var(--navy-600);}
  .countdown-badge{display:inline-flex;align-items:center;gap:5px;margin-top:8px;padding:5px 12px;border-radius:20px;
    font-size:12px;font-weight:800;}
  .countdown-badge.cd-ok{background:#e5f5ec;color:var(--success);}
  .countdown-badge.cd-soon{background:#fff3d1;color:var(--warn);}
  .countdown-badge.cd-urgent{background:#fdeceb;color:var(--danger);}
  .countdown-badge.cd-done{background:#eef0f3;color:#555;}

  /* ---------------- شيت البيانات القابل للتعديل المباشر ---------------- */
  .cell-input{width:100%;padding:6px 8px;border:1px solid transparent;border-radius:6px;background:transparent;font-size:13px;}
  .cell-input:hover{border-color:var(--line);}
  .cell-input:focus{outline:none;border-color:var(--gold-500);background:#fff;}
  .sheet-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
  .sheet-toolbar a.icon-btn{text-decoration:none;display:inline-flex;align-items:center;}
  /* ---------------- PR team hierarchy ---------------- */
  .pr-team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;}
  .pr-team-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;cursor:pointer;transition:.15s;}
  .pr-team-card:hover{box-shadow:0 8px 20px rgba(12,31,61,.12);transform:translateY(-2px);}
  .pr-team-card .team-title{font-size:16px;font-weight:800;color:var(--navy-900);margin-bottom:8px;}
  .pr-team-card .team-meta{font-size:12px;color:var(--muted);line-height:1.8;}
  .member-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;}
  .member-card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px;cursor:pointer;}
  .member-card:hover{box-shadow:0 7px 18px rgba(12,31,61,.11);}
  .member-card .member-name{font-weight:800;color:var(--navy-900);font-size:15px;}
  .member-card .member-role{font-size:11.5px;color:var(--muted);margin-top:3px;}
  .member-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px;}
  .member-stat{background:var(--sand-50);border-radius:9px;padding:8px;text-align:center;}
  .member-stat b{display:block;font-size:16px;color:var(--navy-800);}
  .member-stat span{font-size:10px;color:var(--muted);}
  .detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;}
  .detail-item{background:var(--sand-50);border-radius:10px;padding:11px;}
  .detail-item .k{font-size:11px;color:var(--muted);margin-bottom:3px;}
  .detail-item .v{font-size:13px;font-weight:700;word-break:break-word;}
  .link-box{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;}

  const GOOGLE_SHEETS_WEBHOOK = 'https://script.google.com/macros/s/AKfycbw7Cnm2cgOiB_6MJ2DJYP8NsLaNDXtbaJKRrLiri4LizkMr7s1Q8-AOzRX8uEg5t_pr/exec';
  let HOMSA_SESSION = sessionStorage.getItem('homsa_session_token') || '';

  async function authRequest(action, payload){
    if(!GOOGLE_SHEETS_WEBHOOK) throw new Error('رابط Google Sheets غير مضبوط');
    if(!HOMSA_SESSION) throw new Error('انتهت جلسة الدخول — سجّل الدخول مرة أخرى');
    const r=await fetch(GOOGLE_SHEETS_WEBHOOK,{
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action,payload:payload||{},session:HOMSA_SESSION}),
      cache:'no-store'
    });
    const data=await r.json().catch(()=>({ok:false,error:'استجابة غير صالحة من الخادم'}));
    if(!data.ok){
      if(data.error==='Unauthorized'){
        HOMSA_SESSION='';
        sessionStorage.removeItem('homsa_session_token');
        sessionStorage.removeItem('homsa_session_user');
        state.user=null;
      }
      throw new Error(data.error||'فشل تنفيذ العملية');
    }
    return data;
  }

  async function sheetRequest(action, table, payload){
    if(!GOOGLE_SHEETS_WEBHOOK) throw new Error('رابط Google Sheets غير مضبوط');
    if(!HOMSA_SESSION) throw new Error('انتهت جلسة الدخول — سجّل الدخول مرة أخرى');
    if(action==='list'){
      const r=await fetch(GOOGLE_SHEETS_WEBHOOK,{method:'POST',
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body:JSON.stringify({action:'list',table,payload:{},session:HOMSA_SESSION}),
        cache:'no-store'});
      const data=await r.json();
      if(!data.ok) {
        if(data.error==='Unauthorized'){ HOMSA_SESSION=''; sessionStorage.removeItem('homsa_session_token'); sessionStorage.removeItem('homsa_session_user'); state.user=null; }
        throw new Error(data.error||'فشل تحميل البيانات من Google Sheets');
      }
      return data.rows||[];
    }
    const r=await fetch(GOOGLE_SHEETS_WEBHOOK,{method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action,table,payload,session:HOMSA_SESSION,at:new Date().toISOString()}),
      keepalive:true});
    const data=await r.json().catch(()=>({ok:true}));
    if(!data.ok) throw new Error(data.error||'فشل حفظ البيانات في Google Sheets');
    return data;
  }

  async function sheetRequestBulk(tables){
    if(!GOOGLE_SHEETS_WEBHOOK) throw new Error('رابط Google Sheets غير مضبوط');
    if(!HOMSA_SESSION) throw new Error('انتهت جلسة الدخول — سجّل الدخول مرة أخرى');
    const r=await fetch(GOOGLE_SHEETS_WEBHOOK,{method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'bulk',tables,payload:{},session:HOMSA_SESSION}),
      cache:'no-store'});
    const data=await r.json();
    if(!data.ok){
      if(data.error==='Unauthorized'){ HOMSA_SESSION=''; sessionStorage.removeItem('homsa_session_token'); sessionStorage.removeItem('homsa_session_user'); state.user=null; }
      throw new Error(data.error||'فشل تحميل البيانات من Google Sheets');
    }
    return data.tables||{};
  }

  /* ---------------- Storage helpers ---------------- */
  async function loadList(key){
    try{ return await sheetRequest('list',key); }
    catch(e){ console.error('Google Sheets load error', key, e); return []; }
  }

  async function apiAdd(table, record){
    if(!record.id) record.id=uid();
    await sheetRequest('upsert',table,record);
    cacheUpsertLocal(table, record);
    if(table==='subscriptions') invalidate('accom_guests');
    return record;
  }

  async function apiUpdate(table, record){
    await sheetRequest('upsert',table,record);
    cacheUpsertLocal(table, record);
    if(table==='subscriptions') invalidate('accom_guests');
  }

  async function apiDelete(table, id){
    await sheetRequest('delete',table,{id});
    cacheDeleteLocal(table, id);
    if(table==='subscriptions') invalidate('accom_guests');
  }

  async function apiDeleteMany(table, ids){
    ids = (ids||[]).filter(Boolean);
    if(!ids.length) return;
    try{
      await sheetRequest('batchDelete',table,{ids});
      ids.forEach(id=>cacheDeleteLocal(table,id));
      if(table==='subscriptions') invalidate('accom_guests');
    }catch(e){
      console.error('batchDelete fallback', table, e);
      await Promise.all(ids.map(id=>apiDelete(table,id)));
      if(table==='subscriptions') invalidate('accom_guests');
    }
  }

  async function apiAddMany(table, records){
    records = (records||[]).filter(Boolean);
    if(!records.length) return records;
    records.forEach(r=>{ if(!r.id) r.id=uid(); });
    try{
      await sheetRequest('batchUpsert',table,{rows:records});
      records.forEach(r=>cacheUpsertLocal(table,r));
      if(table==='subscriptions') invalidate('accom_guests');
    }catch(e){
      console.error('batchUpsert fallback', table, e);
      await Promise.all(records.map(r=>sheetRequest('upsert',table,r)));
      records.forEach(r=>cacheUpsertLocal(table,r));
      if(table==='subscriptions') invalidate('accom_guests');
    }
    return records;
  }

  const cache = {};
  async function getData(key){ if(!cache[key]) cache[key] = await loadList(key); return cache[key]; }
  function invalidate(key){ cache[key] = null; }

  function cacheUpsertLocal(table, record){
    if(!cache[table] || !record || record.id===undefined) return;
    const idx = cache[table].findIndex(r=>String(r.id)===String(record.id));
    if(idx>=0) cache[table][idx] = {...cache[table][idx], ...record};
    else cache[table] = [...cache[table], record];
  }
  function cacheDeleteLocal(table, id){
    if(!cache[table]) return;
    cache[table] = cache[table].filter(r=>String(r.id)!==String(id));
  }

  async function getDataMany(keys){
    const need = [...new Set(keys)].filter(k=>!cache[k]);
    if(need.length){
      try{
        const result = await sheetRequestBulk(need);
        need.forEach(k=>{ cache[k] = result[k] || []; });
      }catch(e){
        console.error('bulk load error, falling back to parallel single loads', e);
        await Promise.all(need.map(async k=>{ cache[k] = await loadList(k); }));
      }
    }
    const out={}; keys.forEach(k=>out[k]=cache[k]||[]); return out;
  }

  async function prefetchAllData(){
    try{
      const role = state.user && state.user.role;
      if(!role) return;
      const keys = new Set(['employees','dashboards','widgets']);
      accessibleModules().forEach(([k,m])=>{ if(m.fields && m.fields.length) keys.add(k); });
      if(MODULES.accommodation.roles.includes(role)){
        ['accom_hotels','accom_rooms','accom_guests'].forEach(k=>keys.add(k));
      }
      if(MODULES.trips_hub.roles.includes(role)){
        ['trips','trip_hotels','accom_hotels','accom_rooms','accom_guests'].forEach(k=>keys.add(k));
      }
      if(MODULES.winners.roles.includes(role)){
        ['subscriptions','trips','accom_hotels','accom_rooms'].forEach(k=>keys.add(k));
      }
      await getDataMany([...keys]);
    }catch(e){ console.error('background prefetch error', e); }
  }

  function uid(){ return 'id'+Math.random().toString(36).slice(2,10); }
  function esc(s){ return (s===undefined||s===null)?'':String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function debounce(fn, wait){
    let t;
    return function(...args){
      clearTimeout(t);
      t = setTimeout(()=>fn.apply(this,args), wait);
    };
  }
  function roomTypeBadge(t){
    const map = {'رجال':'blue','سيدات':'gold','عائلية':'green'};
    return t? `<span class="badge ${map[t]||'gray'}">${esc(t)}</span>` : `<span class="badge gray">غير محدد</span>`;
  }
  function linkLabel(ref, r){
    if(!r) return '';
    if(ref==='trips') return (r.label? r.label+' — ':'') + (r.date||'بدون تاريخ');
    if(ref==='accom_hotels') return r.name + (r.location? ' — '+r.location : '');
    if(ref==='accom_rooms') return 'غرفة ' + (r.roomNumber||'') + (r.roomType? ' — '+r.roomType:'');
    return r.name || r.title || r.id;
  }

  function generateCustomerCode(phone){
    const digits = String(phone||'').replace(/\D/g,'');
    const last4 = (digits.slice(-4) || '0000').padStart(4,'0');
    const now = new Date();
    const dd = String(now.getDate()).padStart(2,'0');
    const mm = String(now.getMonth()+1).padStart(2,'0');
    return 'ID' + last4 + dd + mm;
  }

  function submitGuard(form){
    const btn = form.querySelector('button[type=submit]');
    if(!btn) return {ok:true, release:()=>{}};
    if(btn.disabled) return {ok:false, release:()=>{}};
    const origText = btn.textContent;
    btn.disabled = true; btn.textContent = 'جارٍ الحفظ...';
    return {ok:true, release:()=>{ btn.disabled=false; btn.textContent=origText; }};
  }

  async function linkSelectOptionsFor(moduleKey, f, parentVal){
    if(moduleKey==='subscriptions' && f.key==='hotelId' && f.ref==='accom_hotels' && f.parentKey==='tripId'){
      if(!parentVal) return [];
      const tripHotels = await getData('trip_hotels');
      const hotels = await getData('accom_hotels');
      const hotelIds = tripHotels.filter(th=>String(th.tripId)===String(parentVal)).map(th=>th.hotelId);
      return hotels.filter(h=>hotelIds.includes(h.id)).map(h=>({id:h.id, label: linkLabel('accom_hotels', h)}));
    }
    const refList = await getData(f.ref);
    if(!f.parentKey) return refList.map(r=>({id:r.id, label: linkLabel(f.ref, r)}));
    const list = parentVal? refList.filter(r=> String(r[f.parentKey])===String(parentVal)) : [];
    return list.map(r=>({id:r.id, label: linkLabel(f.ref, r)}));
  }


  /* ---------------- PR access control ---------------- */
  function isPRUser(){ return ['pr_manager','pr_leader','pr_member'].includes(state.user?.role); }
  function canManageAccommodation(){ return ['admin','accommodation','system'].includes(state.user.role); }
  // طبّع اسم الفريق: بيشيل مسافات البداية/النهاية عشان أي مسافة زيادة اتكتبت
  // غلط في شيت الموظفين ما تكسرش مقارنة الفريق. نفس الدالة موجودة في السيرفر
  // (Apps Script) عشان مقارنة الفريق تبقى متطابقة تمامًا بين الواجهة والسيرفر.
  function normTeam(v){ return String(v||'').trim(); }
  function currentEmployee(){
    if(!state.user) return null;
    const list = cache.employees || [];
    return list.find(e => (e.username && state.user.username && String(e.username).toLowerCase()===String(state.user.username).toLowerCase())
      || e.id===state.user.employeeId) || null;
  }
  async function currentEmployeeFresh(){
    const emps=await getData('employees');
    return emps.find(e => (e.username && state.user.username && String(e.username).toLowerCase()===String(state.user.username).toLowerCase())
      || e.id===state.user.employeeId) || null;
  }
  async function prTeamName(){
    const emp=await currentEmployeeFresh();
    return normTeam(emp?.team || state.user?.team || '');
  }
  async function prTeamMembers(){
    const emps=await getData('employees');
    if(state.user.role==='pr_manager') return emps.filter(e=>e.status!=='inactive');
    const team=await prTeamName();
    return emps.filter(e=>e.status!=='inactive' && normTeam(e.team)===team);
  }
  async function prAllowedNames(){
    const members=await prTeamMembers();
    return new Set(members.map(e=>e.name).filter(Boolean));
  }
  async function filterPRData(key,data){
    if(!isPRUser()) return data;
    if(state.user.role==='pr_manager') return data;
    const emp=await currentEmployeeFresh();
    const myName=emp?.name || state.user.name;
    const teamNames=await prAllowedNames();
    if(key==='employees') return data.filter(r=>teamNames.has(r.name));
    if(key==='teams') {
      const team=await prTeamName();
      return data.filter(r=>normTeam(r.name)===team);
    }
    if(key==='indoor_leads' || key==='indoor_data' || key==='subscriptions'){
      return data.filter(r=>teamNames.has(r.responsiblePerson) && (state.user.role==='pr_leader' || r.responsiblePerson===myName));
    }
    if(key==='pr_member_data'){
      return data.filter(r=>teamNames.has(r.memberId) && (state.user.role==='pr_leader' || r.memberId===myName));
    }
    return data;
  }
  function prCanEditRow(key,row){
    // عرض فقط: التسكين والحسابات بقى يقدروا يشوفوا الاشتراكات/الفائزين، بس
    // مايقدروش يضيفوا أو يعدلوا أو يحذفوا فيهم — باقي صلاحياتهم (زي التسكين
    // والرحلات) متغيرتش خالص.
    if(['accommodation','accounting'].includes(state.user.role) && key==='subscriptions') return false;
    if(!isPRUser()) return true;
    if(state.user.role==='pr_manager') return true;
    const myName = currentEmployee()?.name || state.user.name;
    if(state.user.role==='pr_leader'){
      if(['indoor_leads','indoor_data','subscriptions'].includes(key)) return true;
      if(key==='pr_member_data') return true;
      return false;
    }
    if(key==='indoor_leads' || key==='indoor_data' || key==='subscriptions') return !row?.id || row.responsiblePerson===myName;
    if(key==='pr_member_data') return !row?.id || row.memberId===myName;
    return key==='employees' && row?.name===myName;
  }
  async function maybeCreateSubscriptionFromLead(lead){
    if(lead.type!=='مهتم' || lead.status!=='مشترك') return;
    const subs=await getData('subscriptions');
    if(subs.some(s=>String(s.leadId||'')===String(lead.id))) return;
    const sub={
      id:uid(), leadId:lead.id, customerName:lead.name||'', nationalId:lead.nationalId||'', phone:lead.phone||'',
      gender:'', governorate:'', groupName:'',
      responsiblePerson:lead.responsiblePerson||'', subscriptionDate:new Date().toISOString().slice(0,10),
      packageType:'', installmentMonths:'', installmentAmount:'', downPayment:'',
      lotteryStatus:'لسه مش عارف', travelStatus:'لسه مسافر',
      subscriptionStatus:'نشط', notes:lead.notes||''
    };
    await apiAdd('subscriptions',sub);
  }

  async function syncSubscriptionGuest(sub){
    const guests = await getData('accom_guests');
    const existing = guests.find(g=>String(g.subscriptionId||'')===String(sub.id));

    if(!sub.roomId){
      if(existing) await apiDelete('accom_guests', existing.id);
      return;
    }

    const rec = {
      id: existing? existing.id : uid(),
      subscriptionId: sub.id,
      roomId: sub.roomId,
      tripId: sub.tripId||'',
      name: sub.customerName||'',
      nationalId: sub.nationalId||'',
      phone: sub.phone||'',
      passportNumber: existing? (existing.passportNumber||'') : '',
      flightStatus: existing? (existing.flightStatus||'لم يُحجز') : 'لم يُحجز',
      notes: existing? (existing.notes||'') : ''
    };
    if(existing) await apiUpdate('accom_guests', rec); else await apiAdd('accom_guests', rec);
  }

  async function render(){
    if(!state.user){ renderLogin(); return; }
    if(!root.querySelector('.shell')){
      buildShell();
      prefetchAllData(); // من غير await قصدًا: يشتغل في الخلفية ومايأخرش عرض الداشبورد
    } else {
      const sb = root.querySelector('.sidebar');
      if(sb) sb.classList.toggle('open', !!state.sidebarOpen);
    }
    updateActiveNav();
    await renderPage();
  }

    root.querySelectorAll('.nav-item').forEach(b=>{

    root.innerHTML = `
      <div class="login-screen">
        <div class="login-hero">
          <div class="hero-pattern"></div>
          <div class="hero-content">
            <div class="hero-icon-wrap"><img src="logo-mark.png" alt="همسة للسياحة"/></div>

            <div class="hero-divider"></div>

          </div>
        </div>
        <div class="login-panel">
          <div class="login-panel-inner">
            <h1>تسجيل الدخول</h1>
            <p class="sub">أدخل بيانات حسابك للمتابعة إلى نظام إدارة همسة</p>
            ${state.loginError? `<div class="error-box">${esc(state.loginError)}</div>`:''}
            <form id="login-form">
              <div class="login-field"><label>اسم المستخدم</label>
                <div class="input-line"><input id="login-u" type="text" autocomplete="username" required/></div>
              </div>
              <div class="login-field"><label>كلمة المرور</label>
                <div class="input-line"><input id="login-p" type="password" autocomplete="current-password" required/></div>
              </div>
              <button class="login-submit" type="submit">دخول</button>
            </form>
            <div class="login-foot">تواجه مشكلة في الدخول؟ تواصل مع مسؤول النظام</div>
          </div>
        </div>
      </div>`;
    document.getElementById('login-form').addEventListener('submit', async e=>{
      e.preventDefault();
      const btn = e.target.querySelector('button[type=submit]');
      const u = document.getElementById('login-u').value.trim().toLowerCase();
      const p = document.getElementById('login-p').value;
      btn.textContent = 'جارٍ الدخول...'; btn.disabled = true;
      try{
        const response = await fetch(GOOGLE_SHEETS_WEBHOOK,{
          method:'POST',
          headers:{'Content-Type':'text/plain;charset=utf-8'},
          body:JSON.stringify({action:'login',username:u,password:p}),
          cache:'no-store'
        });
        const data = await response.json();
        if(!data.ok) throw new Error(data.error||'اسم المستخدم أو كلمة المرور غير صحيحة');
        HOMSA_SESSION=data.session;
        sessionStorage.setItem('homsa_session_token',HOMSA_SESSION);
        state.user = data.user; state.loginError=null; state.view='dashboard';
        sessionStorage.setItem('homsa_session_user', JSON.stringify(data.user));
        render();
      }catch(err){
        console.error('Login error', err);
        state.loginError = err.message || 'تعذر تسجيل الدخول';
        renderLogin();
      }
    });
  }


  function accessibleModules(){
    const hiddenModules = new Set(['companies','callcenter_payments','indoor_data']);
    if(state.user?.role==='pr_manager') {
      return Object.entries(MODULES).filter(([k,m])=>!hiddenModules.has(k) && m.roles.includes('pr_manager'));
    }
    if(state.user?.role==='pr_leader' || state.user?.role==='pr_member') {
      return Object.entries(MODULES).filter(([k,m])=>!hiddenModules.has(k) && m.roles.includes(state.user.role));
    }
    return Object.entries(MODULES).filter(([k,m])=>!hiddenModules.has(k) && m.roles.includes(state.user.role));
  }

  function analyticsAccessibleModules(){
    if(state.user.role==='admin' || state.user.role==='analyst') return Object.entries(MODULES).filter(([k])=>!['companies','callcenter_payments','indoor_data'].includes(k));
    return accessibleModules();
  }

  async function getSetting(key){
    const rows = await getData('app_settings');
    const row = rows.find(r=>r.key===key);
    return row? (row.value||'') : '';
  }
  async function setSetting(key, value){
    const rows = await getData('app_settings');
    const row = rows.find(r=>r.key===key);
    const rec = row? {...row, value} : {id:'cfg_'+key, key, value};
    await apiAdd('app_settings', rec);
  }

  function buildShell(){
    const mods = accessibleModules();
    // بنجمع عناصر القائمة الجانبية في مجموعات منطقية (نظرة عامة / علاقات عامة /
    // تشغيل وحجوزات / إدارة) بدل ما تبقى كلها في عمود واحد طويل، عشان القائمة
    // تبقى أسهل في التصفح وأكثر تنظيمًا مع زيادة عدد الأقسام حسب الصلاحية.
    const NAV_GROUP_OF = {
      teams:'admin', employees:'admin',
      companies:'pr', visits:'pr', indoor_leads:'pr', indoor_data:'pr', pr_member_data:'pr',
      callcenter_feedback:'ops', callcenter_payments:'ops', accommodation:'ops', trips_hub:'ops',
      subscriptions:'ops', winners:'ops'
    };
    const GROUP_LABELS = { main:'نظرة عامة', pr:'العلاقات العامة', ops:'التشغيل والحجوزات', admin:'الإدارة والموارد البشرية' };
    const groups = { main:[], pr:[], ops:[], admin:[] };
    groups.main.push(`<button class="nav-item ${state.view==='dashboard'?'active':''}" data-view="dashboard">🏠<span>الرئيسية</span></button>`);
    groups.main.push(`<button class="nav-item ${state.view==='analytics'?'active':''}" data-view="analytics">📊<span>تحليل البيانات</span></button>`);
    if(isPRUser()){
      groups.pr.push(`<button class="nav-item ${state.view==='pr_teams'?'active':''}" data-view="pr_teams">🧩<span>${state.user.role==='pr_member'?'بياناتي':'فرق العلاقات العامة'}</span></button>`);
    }
    mods.forEach(([k,m])=>{
      const g = NAV_GROUP_OF[k] || 'ops';
      groups[g].push(`<button class="nav-item ${state.view===k?'active':''}" data-view="${k}">${m.icon}<span>${esc(m.title)}</span></button>`);
    });
    const navHtml = ['main','pr','ops','admin'].filter(g=>groups[g].length).map(g=>
      `<div class="nav-section"><div class="nav-section-label">${GROUP_LABELS[g]}</div>${groups[g].join('')}</div>`
    ).join('');

    root.innerHTML = `
      <div class="shell">
        <div class="sidebar ${state.sidebarOpen?'open':''}">
          <div class="sidebar-head"><img src="${LOGO}"/><span>همسة للسياحة</span></div>
          <div class="nav">${navHtml}</div>
          <div class="sidebar-foot">
            <div class="user-chip">
              <div class="avatar">${esc(state.user.name[0])}</div>
              <div><div class="name">${esc(state.user.name)}</div><div class="role">${esc(ROLE_LABELS[state.user.role])}</div></div>
            </div>
            <button class="logout-btn" id="account-btn" style="margin-bottom:6px;background:#3a3a3a;">تغيير بيانات الدخول</button>
            <button class="logout-btn" id="logout-btn">تسجيل الخروج</button>
          </div>
        </div>
        <div class="main">
          <button class="menu-toggle" id="menu-toggle">☰ القائمة</button>
          <div id="page"></div>
        </div>
      </div>`;

    root.querySelectorAll('.nav-item').forEach(b=>b.addEventListener('click', ()=>{ state.view=b.dataset.view; state.indoorLeadsType=null; state.sidebarOpen=false; render(); }));
    document.getElementById('logout-btn').addEventListener('click', async ()=>{
      const btn=document.getElementById('logout-btn');
      if(btn) btn.disabled=true;
      try{ if(HOMSA_SESSION) await authRequest('logout',{}); }catch(e){ console.warn('Logout server-side revoke failed',e); }
      sessionStorage.removeItem('homsa_session_user');
      sessionStorage.removeItem('homsa_session_token');
      HOMSA_SESSION=''; state.user=null; state.view='dashboard'; render();
    });
    document.getElementById('account-btn').addEventListener('click', openChangeAccountForm);
    document.getElementById('menu-toggle').addEventListener('click', ()=>{
      state.sidebarOpen=!state.sidebarOpen;
      const sb=root.querySelector('.sidebar'); if(sb) sb.classList.toggle('open', state.sidebarOpen);
    });

  async function renderPage(){
    const page = document.getElementById('page');
    if(!page) return;
    const mods = accessibleModules();
    if(['areas','ledger','companies','callcenter_payments','indoor_data'].includes(state.view)){
      state.view='dashboard'; updateActiveNav();
    }
    if(state.view==='dashboard') await renderDashboard(page, mods);
    else if(state.view==='pr_teams') await renderPRHierarchy(page);
    else if(state.view==='analytics') await renderAnalytics(page, analyticsAccessibleModules());
    else if(state.view==='accommodation') await renderAccommodationSection(page);
    else if(state.view==='trips_hub') await renderTripsHub(page);
    else if(state.view==='winners') await renderWinnersSection(page);
    else if(state.view==='indoor_leads') await renderIndoorLeadsSection(page);
    else if(MODULES[state.view]) await renderModule(page, state.view);
  }

  async function openLedgerForm(id, presetClient){
    const list = await getData('accounting');
    const row = id? list.find(r=>r.id===id) : (presetClient? {clientName:presetClient}: {});
    const modalBg = document.createElement('div');
    modalBg.className = 'modal-bg';
    modalBg.innerHTML = `<div class="modal">
      <h3>${id? 'تعديل قيد':'إضافة قيد جديد'} — كشف الحساب</h3>
      <form id="ledger-form"><div class="form-grid">
        ${LEDGER_FIELDS.map(f=>renderField(f, row, {})).join('')}

        <button type="submit" class="btn-primary btn-gold">حفظ</button>
      </div></form>
    </div>`;

    modalBg.querySelector('#cancel-btn').addEventListener('click', ()=>modalBg.remove());
    modalBg.addEventListener('click', e=>{ if(e.target===modalBg) modalBg.remove(); });

  const CHART_COLORS = ['#b3261e','#f2b705','#1a7a4c','#25508f','#a5690a','#6b7280',
    '#8b5cf6','#0891b2','#dc2626','#059669','#d97706','#0284c7'];

  function moduleDimensionOptions(mod){
    const opts = [];
    mod.fields.forEach(f=>{
      if(f.type==='select' || f.type==='dynamicSelect'){
        opts.push({key:f.key, label:f.label});
        if(f.type==='dynamicSelect' && f.ref==='employees'){
          opts.push({key:f.key+'__team', label:f.label+' — الفريق'});
        }
      }
    });
    return opts;
  }
  function moduleMetricFields(mod){ return mod.fields.filter(f=>f.type==='number'); }
  function moduleFilterFields(mod){ return mod.fields.filter(f=>f.type==='select' || f.type==='dynamicSelect'); }

  async function employeeTeamMap(){
    const emps = await getData('employees');
    const map = {};
    emps.forEach(e=>{ if(e.name) map[e.name] = e.team || 'بدون فريق'; });
    return map;
  }

  function dimValue(row, dimKey, teamMap){
    if(dimKey.endsWith('__team')){
      const base = dimKey.slice(0, -('__team'.length));
      const person = row[base];
      return (person && teamMap[person]) || 'بدون فريق';
    }
    return row[dimKey] || 'غير محدد';
  }

  function groupAndAggregate(rows, dimKey, metric, metricField, teamMap){
    if(!dimKey){
      const total = metric==='sum'? rows.reduce((s,r)=>s+num_(r[metricField]),0) : rows.length;
      return [{label:'الإجمالي', value: total}];
    }
    const map = {};
    rows.forEach(r=>{
      const g = dimValue(r, dimKey, teamMap);
      if(!(g in map)) map[g]=0;
      map[g] += (metric==='sum') ? num_(r[metricField]) : 1;
    });
    return Object.entries(map).map(([k,v])=>({label:k, value:v})).sort((a,b)=>b.value-a.value);
  }

  function renderPieWidget(entries){
    const total = entries.reduce((s,e)=>s+e.value,0) || 1;
    let acc = 0;
    const stops = entries.map((e,i)=>{
      const start = acc/total*360; acc += e.value; const end = acc/total*360;
      return `${CHART_COLORS[i % CHART_COLORS.length]} ${start}deg ${end}deg`;
    }).join(', ');
    const legend = entries.map((e,i)=>{
      const pct = Math.round(e.value/total*1000)/10;
      return `<div class="legend-row"><span class="dot" style="background:${CHART_COLORS[i % CHART_COLORS.length]}"></span>
        <span class="legend-lbl">${esc(e.label)}</span><span class="legend-val">${e.value} (${pct}%)</span></div>`;
    }).join('');
    return `<div class="pie-wrap">
      <div class="pie-donut-wrap"><div class="pie-donut" style="background:conic-gradient(${entries.length?stops:'#eee 0deg 360deg'});"></div><div class="pie-hole"></div></div>
      <div class="pie-legend">${legend || '<div class="empty-mini">لا توجد بيانات</div>'}</div>
    </div>`;
  }

  function renderBarWidget(entries){
    if(!entries.length) return '<div class="empty-mini">لا توجد بيانات</div>';
    const max = Math.max(1, ...entries.map(e=>e.value));
    return `<div class="bar-wrap">${entries.map((e,i)=>{
      const pct = Math.round(e.value/max*100);
      return `<div class="bar-row"><div class="bar-lbl">${esc(e.label)}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${CHART_COLORS[i % CHART_COLORS.length]};"></div></div>
        <span class="bar-val">${e.value}</span></div>`;
    }).join('')}</div>`;
  }

  function renderTableWidget(entries){
    return `<div class="table-wrap"><table><thead><tr><th>الفئة</th><th>القيمة</th></tr></thead>
      <tbody>${entries.length? entries.map(e=>`<tr><td>${esc(e.label)}</td><td><b>${e.value}</b></td></tr>`).join('') :
      `<tr><td colspan="2" style="text-align:center;color:var(--muted);">لا توجد بيانات</td></tr>`}</tbody></table></div>`;
  }

  function renderNumberWidget(entries){
    const total = entries.reduce((s,e)=>s+e.value,0);
    return `<div class="stat-number">${total.toLocaleString('ar-EG')}</div>`;
  }

  function renderWidgetBody(chartType, entries){
    if(chartType==='pie') return renderPieWidget(entries);
    if(chartType==='bar') return renderBarWidget(entries);
    if(chartType==='table') return renderTableWidget(entries);
    return renderNumberWidget(entries);
  }

  async function renderAnalytics(page, mods){
    const accessibleKeys = new Set(mods.map(([k])=>k));
    await getDataMany(['dashboards','widgets','employees']);
    const allBoards = await getData('dashboards');
    const myBoards = allBoards.filter(b=> accessibleKeys.has(b.sourceModule));
    if(!state.analyticsBoard || !myBoards.find(b=>b.id===state.analyticsBoard)){
      state.analyticsBoard = myBoards.length? myBoards[0].id : null;
    }
    const board = myBoards.find(b=>b.id===state.analyticsBoard) || null;
    state.analyticsFilters = state.analyticsFilters || {};

    let bodyHtml, mod, widgets;
    if(!board){
      bodyHtml = `<div class="card"><div class="empty-state"><div class="big">📊</div>لا توجد لوحات تحليل بعد — اضغط "+ لوحة جديدة" لبدء بناء التحليلات الخاصة بقسمك</div></div>`;
    } else {
      mod = MODULES[board.sourceModule];
      const rawData = await getData(board.sourceModule);
      const teamMap = await employeeTeamMap();
      const filterFields = moduleFilterFields(mod);
      const filtersHtml = filterFields.map(f=>{
        const options = f.type==='select'? f.options : [...new Set(rawData.map(r=>r[f.key]).filter(Boolean))];
        const cur = state.analyticsFilters[f.key] || '';
        return `<select class="analytics-filter" data-field="${f.key}">
          <option value="">${esc(f.label)}: الكل</option>
          ${options.map(o=>`<option value="${esc(o)}" ${o===cur?'selected':''}>${esc(o)}</option>`).join('')}
        </select>`;
      }).join('');

        const v = state.analyticsFilters[f.key]; return !v || r[f.key]===v;

      widgets = (await getData('widgets')).filter(w=>w.dashboardId===board.id);

    const boardTabs = myBoards.map(b=>`<button class="board-tab ${b.id===state.analyticsBoard?'active':''}" data-board="${b.id}">${MODULES[b.sourceModule]? MODULES[b.sourceModule].icon:'📊'} ${esc(b.name)}</button>`).join('');

    page.innerHTML = `

        <h2>📊 تحليل البيانات</h2>
        <button class="btn-primary btn-gold" id="new-board-btn" style="width:auto;padding:10px 20px;">+ لوحة جديدة</button>

      state.analyticsBoard=b.dataset.board; state.analyticsFilters={}; render();
    }));

        state.analyticsFilters[sel.dataset.field] = sel.value; render();

  let accomMigrationChecked = false;
  async function ensureAccommodationMigration(){
    if(accomMigrationChecked) return;
    accomMigrationChecked = true;
    try{
      const flag = await getSetting('accom_migration_v2_done');
      if(flag==='yes') return;
      await getDataMany(['accom_hotels','trip_hotels','accom_rooms','accom_guests']);
      const hotels = await getData('accom_hotels');
      const tripHotels = await getData('trip_hotels');
      const rooms = await getData('accom_rooms');
      const guests = await getData('accom_guests');
      const newLinks = [];
      const guestUpdates = [];
      hotels.forEach(h=>{
        const legacyTripId = h.tripId;
        if(!legacyTripId) return;
        const exists = tripHotels.some(th=>String(th.tripId)===String(legacyTripId) && String(th.hotelId)===String(h.id));
        if(!exists) newLinks.push({id:uid(), tripId:legacyTripId, hotelId:h.id, notes:''});
        const hotelRoomIds = rooms.filter(r=>r.hotelId===h.id).map(r=>r.id);
        guests.forEach(g=>{
          if(hotelRoomIds.includes(g.roomId) && !g.tripId){
            guestUpdates.push({...g, tripId: legacyTripId});
          }
        });
      });
      if(newLinks.length) await apiAddMany('trip_hotels', newLinks);
      if(guestUpdates.length) await apiAddMany('accom_guests', guestUpdates);
      await setSetting('accom_migration_v2_done','yes');
    }catch(e){ console.error('accommodation migration error', e); }
  }

      return sep + (isLast? `<span>${esc(it.label)}</span>` : `<button data-crumb="${i}">${esc(it.label)}</button>`);
    }).join('')}</div>`;

  function tripCountdownHtml(trip, assignedCount){
    const capacity = num_(trip.capacity);
    if(!capacity) return '';
    const remaining = capacity - assignedCount;
    if(remaining <= 0) return `<div class="countdown-badge cd-done">✔ تم اكتمال الرحلة</div>`;
    if(remaining <= 3) return `<div class="countdown-badge cd-urgent">⏳ متبقي ${remaining} على اكتمال الرحلة</div>`;
    if(remaining <= 10) return `<div class="countdown-badge cd-soon">⏳ متبقي ${remaining} على اكتمال الرحلة</div>`;
    return `<div class="countdown-badge cd-ok">⏳ متبقي ${remaining} على اكتمال الرحلة</div>`;
  }

  async function renderWinnersSection(page){
    if(!MODULES.winners.roles.includes(state.user.role)) return;
    await getDataMany(['subscriptions','trips','accom_hotels','accom_rooms']);
    let data = await filterPRData('subscriptions', await getData('subscriptions'));
    data = data.filter(r=>String(r.lotteryStatus||'')==='فائز');

    const trips=cache['trips']||[], hotels=cache['accom_hotels']||[], rooms=cache['accom_rooms']||[];
    const tripMap=Object.fromEntries(trips.map(r=>[r.id,linkLabel('trips',r)]));
    const hotelMap=Object.fromEntries(hotels.map(r=>[r.id,linkLabel('accom_hotels',r)]));
    const roomMap=Object.fromEntries(rooms.map(r=>[r.id,linkLabel('accom_rooms',r)]));
    // عرض فقط: التسكين والحسابات يشوفوا الفائزين، بس مايقدروش يغيّروا رحلة
    // الفائز ولا يفتحوا فورم التعديل من هنا (نفس منطق prCanEditRow بالظبط).
    const canEditWinners = prCanEditRow('subscriptions', null);

    const WINNER_FILTER_FIELDS = [
      {key:'gender', label:'الجنس', options:['ذكر','أنثى']},
      {key:'governorate', label:'المحافظة', options:EGYPT_GOVERNORATES},
      {key:'packageType', label:'نوع الباقة', options:['عمرة كاش','عمرة قسط','عمرة تيسير','تيسير رمضان','حج قرعة تيسير','حج قرعة عادي','حج سياحي']},
      {key:'travelStatus', label:'حالة السفر', options:['لسه مسافر','سافر']},
    ];
    state.winnersFilters = state.winnersFilters || {};
    const activeFilters = state.winnersFilters;
    const columnFilteredData = applyColumnFilters(data, activeFilters);

    state.moduleSearch=state.moduleSearch||{};
    const searchTerm=state.moduleSearch.winners||'';
    // بنحسب نص البحث لكل صف مرة واحدة بس (مش مع كل حرف يتكتب)، عشان تفادي
    // إعادة حساب join/toLowerCase على كل الصفوف مع كل ضغطة زر أثناء الكتابة.
    const searchIndex=columnFilteredData.map(r=>({row:r, text:[r.customerName,r.packageType,r.phone,r.nationalId,r.gender,r.governorate,r.travelStatus,tripMap[r.tripId],hotelMap[r.hotelId],roomMap[r.roomId]].join(' ').toLowerCase()}));
    const getRows=term=>{
      term=String(term||'').trim().toLowerCase();
      return term? searchIndex.filter(x=>x.text.includes(term)).map(x=>x.row) : columnFilteredData;
    };
    const tableHtml=rows=>!rows.length
      ? `<div class="empty-state"><div class="big">${data.length?'🔍':'🏆'}</div>${data.length?'لا توجد نتائج مطابقة للبحث/الفلتر':'لا يوجد فائزون حتى الآن'}</div>`
      : `<div class="table-wrap"><table><thead><tr><th>العميل</th><th>نوع الاشتراك</th><th>الهاتف</th><th>الرقم القومي</th><th>الجنس</th><th>المحافظة</th><th>حالة القرعة</th><th>الرحلة</th><th>الفندق</th><th>الغرفة</th><th>حالة السفر</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr>
        <td>${esc(r.customerName||'')}</td><td>${esc(r.packageType||'')}</td><td>${esc(r.phone||'')}</td><td>${esc(r.nationalId||'')}</td><td>${esc(r.gender||'')}</td><td>${esc(r.governorate||'')}</td>
        <td><span class="badge gold">فائز</span></td>
        <td>${canEditWinners
          ? `<select class="winner-trip-select" data-id="${esc(r.id)}" style="min-width:180px"><option value="">— بدون رحلة —</option>${trips.map(t=>`<option value="${esc(t.id)}" ${String(t.id)===String(r.tripId||'')?'selected':''}>${esc(linkLabel('trips',t))}</option>`).join('')}</select>`
          : esc(tripMap[r.tripId]||'—')}</td>
        <td>${esc(hotelMap[r.hotelId]||'—')}</td><td>${esc(roomMap[r.roomId]||'—')}</td><td>${esc(r.travelStatus||'لسه مسافر')}</td>
        <td>${canEditWinners ? `<button class="icon-btn" data-winner-edit="${esc(r.id)}">✏️</button>` : ''}</td>
      </tr>`).join('')}</tbody></table></div>`;
    const filterBarHtml = `<div class="analytics-filterbar" id="winners-filterbar" style="margin-top:10px;${Object.values(activeFilters).some(v=>v)?'':'display:none;'}">
      ${WINNER_FILTER_FIELDS.map(f=>{
        const cur = activeFilters[f.key]||'';
        return `<select class="analytics-filter" data-filterfield="${f.key}">
          <option value="">${esc(f.label)}: الكل</option>
          ${f.options.map(o=>`<option value="${esc(o)}" ${o===cur?'selected':''}>${esc(o)}</option>`).join('')}
        </select>`;
      }).join('')}
      <button class="btn-secondary" id="clear-winners-filters" style="width:auto;padding:8px 14px;">✖ مسح الفلاتر</button>
    </div>`;
    page.innerHTML=`<div class="page-head"><h2>🏆 الفائزون</h2></div>
      ${isPRUser()&&state.user.role!=='pr_manager'?`<div class="assumption-note">البيانات المعروضة هنا خاصة بنطاق صلاحيتك.</div>`:''}
      ${!canEditWinners?`<div class="assumption-note">عرض فقط: ليس لديك صلاحية تعديل بيانات الفائزين.</div>`:''}
      ${data.length?`<div class="card" style="padding:14px 20px;margin-bottom:14px;">
        <div style="display:flex;gap:10px;align-items:center;">
          <input type="text" id="winners-search-input" placeholder="🔍 ابحث في الفائزون..." value="${esc(searchTerm)}" style="flex:1;padding:10px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:14px;background:var(--sand-50);"/>
          <button class="icon-btn" id="winners-filter-toggle" style="background:var(--sand-100);white-space:nowrap;">🔽 فلتر</button>
        </div>
        ${filterBarHtml}
      </div>`:''}
      <div class="card"><div id="winners-table-wrap">${tableHtml(getRows(searchTerm))}</div></div>`;
    const bind=container=>{
      container.querySelectorAll('[data-winner-edit]').forEach(b=>b.addEventListener('click',()=>openForm('subscriptions',b.dataset.winnerEdit)));
      container.querySelectorAll('.winner-trip-select').forEach(sel=>sel.addEventListener('change',async()=>{
        const subs=await getData('subscriptions'), row=subs.find(x=>String(x.id)===String(sel.dataset.id)); if(!row)return;
        sel.disabled=true;
        try{const updated={...row,tripId:sel.value}; await apiUpdate('subscriptions',updated); await syncSubscriptionGuest(updated); render();}
        catch(err){console.error(err);alert(err.message||'تعذر تحديث الرحلة');sel.disabled=false;}
      }));
    };
    const wrap=document.getElementById('winners-table-wrap'); bind(wrap);
    const filterToggleBtn = document.getElementById('winners-filter-toggle');
    if(filterToggleBtn){
      filterToggleBtn.addEventListener('click', ()=>{
        const bar = document.getElementById('winners-filterbar');
        if(bar) bar.style.display = bar.style.display==='none' ? '' : 'none';
      });
    }
    page.querySelectorAll('#winners-filterbar .analytics-filter').forEach(sel=>{
      sel.addEventListener('change', ()=>{
        state.winnersFilters[sel.dataset.filterfield] = sel.value;
        render();
      });
    });
    const clearWinnersFiltersBtn = document.getElementById('clear-winners-filters');
    if(clearWinnersFiltersBtn) clearWinnersFiltersBtn.addEventListener('click', ()=>{ state.winnersFilters={}; render(); });
    const input=document.getElementById('winners-search-input');
    if(input){
      // debounce على البحث: بنستنى المستخدم يوقف عن الكتابة 180ms قبل إعادة رسم
      // الجدول، بدل ما نعيد الرسم مع كل حرف يتكتب — ده كان بيسبب لاج واضح في الكتابة.
      let winnersDebounce;
      input.addEventListener('input',()=>{
        state.moduleSearch.winners=input.value;
        clearTimeout(winnersDebounce);
        winnersDebounce=setTimeout(()=>{
          wrap.innerHTML=tableHtml(getRows(input.value));
          bind(wrap);
        },180);
      });
    }
  }

  function subsHotelsForTrip(tripId){
    if(!tripId) return [];
    const tripHotels = (cache.trip_hotels||[]).filter(th=>String(th.tripId)===String(tripId));
    const hotels = cache.accom_hotels||[];
    const ids = tripHotels.map(th=>th.hotelId);
    return hotels.filter(h=>ids.includes(h.id));
  }
  function subsRoomsForHotel(hotelId){
    if(!hotelId) return [];
    return (cache.accom_rooms||[]).filter(r=>r.hotelId===hotelId);
  }
  function renderAccommodationAssignRow(mod, row, linkMaps){
    const hotels = subsHotelsForTrip(row.tripId);
    const rooms = subsRoomsForHotel(row.hotelId);
    const trips = cache.trips||[];
    return `<tr>${mod.fields.map(f=>{
      if(f.key==='tripId'){
        return `<td><select class="assign-select assign-trip" data-id="${esc(row.id)}">
          <option value="">— بدون —</option>
          ${trips.map(t=>`<option value="${esc(t.id)}" ${String(t.id)===String(row.tripId||'')?'selected':''}>${esc(linkLabel('trips',t))}</option>`).join('')}
        </select></td>`;
      }
      if(f.key==='hotelId'){
        return `<td><select class="assign-select assign-hotel" data-id="${esc(row.id)}" ${!row.tripId?'disabled':''}>
          <option value="">— بدون —</option>
          ${hotels.map(h=>`<option value="${esc(h.id)}" ${String(h.id)===String(row.hotelId||'')?'selected':''}>${esc(linkLabel('accom_hotels',h))}</option>`).join('')}
        </select></td>`;
      }
      if(f.key==='roomId'){
        return `<td><select class="assign-select assign-room" data-id="${esc(row.id)}" ${!row.hotelId?'disabled':''}>
          <option value="">— بدون —</option>
          ${rooms.map(r=>`<option value="${esc(r.id)}" ${String(r.id)===String(row.roomId||'')?'selected':''}>${esc(linkLabel('accom_rooms',r))}</option>`).join('')}
        </select></td>`;
      }
      return `<td>${fieldDisplay(f,row[f.key],linkMaps,row)}</td>`;
    }).join('')}<td></td></tr>`;
  }
  function bindAccommodationAssignEvents(container, visibleData){
    const handle=(sel, buildUpdate)=>{
      sel.addEventListener('change', async ()=>{
        const row = visibleData.find(r=>String(r.id)===String(sel.dataset.id));
        if(!row) return;
        sel.disabled = true;
        try{
          const updated = buildUpdate(row, sel.value);
          await apiUpdate('subscriptions', updated);
          await syncSubscriptionGuest(updated);
          render();
        }catch(err){
          console.error(err); alert(err.message||'تعذر الحفظ'); sel.disabled=false;
        }
      });
    };
    container.querySelectorAll('.assign-trip').forEach(sel=>handle(sel,(row,val)=>({...row, tripId:val, hotelId:'', roomId:''})));
    container.querySelectorAll('.assign-hotel').forEach(sel=>handle(sel,(row,val)=>({...row, hotelId:val, roomId:''})));
    container.querySelectorAll('.assign-room').forEach(sel=>handle(sel,(row,val)=>({...row, roomId:val})));
  }

  /* ---------------- المهتمون والمندوبين: بوابة اختيار بين مربعين ---------------- */

    if(!state.indoorLeadsType){
      await renderIndoorLeadsHub(page);
    } else {
      await renderModule(page, 'indoor_leads', {
        forcedFilter: {type: state.indoorLeadsType},
        forcedAddValues: {type: state.indoorLeadsType},
        crumbs: [{label:'المهتمون والمندوبين'},{label: state.indoorLeadsType==='مهتم'?'المهتمون':'المندوبين'}],

      });
    }
  }

  /* ---------------- فلترة الأعمدة العامة (تُستخدم مع البحث في الموديولات والفائزين) ---------------- */
  function filterableFieldsFor(mod, excludeKeys){
    excludeKeys = excludeKeys || [];
    return mod.fields.filter(f=> (f.type==='select'||f.type==='dynamicSelect') && !excludeKeys.includes(f.key));
  }
  function applyColumnFilters(data, filters){
    const active = Object.entries(filters||{}).filter(([k,v])=>v);
    if(!active.length) return data;
    return data.filter(r=> active.every(([k,v])=> String(r[k]||'')===String(v)));
  }

  /* ---------------- Generic module CRUD renderer ---------------- */
  async function renderModule(page, key, options){
    options = options || {};
    const mod = MODULES[key];
    if(!mod || !mod.roles.includes(state.user.role)) return;
    const linkRefs = mod.fields.filter(f=>f.type==='linkSelect').map(f=>f.ref);
    const extraRefs = key==='subscriptions' ? ['indoor_leads','trip_hotels'] : [];
    await getDataMany([key, ...((isPRUser()||key==='visits')?['employees']:[]), ...linkRefs, ...extraRefs]);
    const allData = await getData(key);
    let data = await filterPRData(key, allData);

    if(options.forcedFilter){
      const ff = options.forcedFilter;
      data = data.filter(r => Object.entries(ff).every(([k,v])=> String(r[k]||'')===String(v)));
    }

    if(key==='visits' && state.user.role!=='admin'){
      const emp = await currentEmployeeFresh();
      const myTeam = emp?.team || '';
      if(myTeam){
        const employees = await getData('employees');
        const teamNames = new Set(employees.filter(e=>e.team===myTeam).map(e=>e.name));
        data = data.filter(r=> teamNames.has(r.visitedBy));
      } else {
        const myName = emp?.name || state.user.name;
        data = data.filter(r=> r.visitedBy===myName);
      }
    }

    if(key==='subscriptions'){
      const leads = await getData('indoor_leads');
      data = data.map(row=>{
        if(row.leadId) return row;

        const rowPhone = String(row.phone||'').replace(/\D/g,'');
        const rowName = String(row.customerName||'').trim();

        const lead = leads.find(l=>{
          const leadPhone = String(l.phone||'').replace(/\D/g,'');
          const leadName = String(l.name||'').trim();

          const phoneMatch = rowPhone && leadPhone && (
            rowPhone===leadPhone ||
            rowPhone.endsWith(leadPhone.slice(-10)) ||
            leadPhone.endsWith(rowPhone.slice(-10))
          );

          const nameMatch = rowName && leadName && rowName===leadName;

          return phoneMatch || nameMatch;
        });

        if(!lead) return row;

        return {
          ...row,
          leadId: lead.id || '',
          nationalId: row.nationalId || lead.nationalId || ''
        };
      });
    }
    const linkMaps = {};
    mod.fields.filter(f=>f.type==='linkSelect').forEach(f=>{
      const refList = cache[f.ref] || [];
      linkMaps[f.key] = Object.fromEntries(refList.map(r=>[r.id, linkLabel(f.ref, r)]));
    });
    if(key==='subscriptions'){
      const leads = cache['indoor_leads'] || [];
      linkMaps.__leadCodes = Object.fromEntries(leads.map(l=>[l.id, l.code||'']));
    }

    state.moduleSearch = state.moduleSearch || {};
    const searchTerm = state.moduleSearch[key] || '';
    // بنحدد الحالة دي بدقة عشان أي دور تاني (PR، أدمن، إلخ) يفضل شغال بالظبط
    // زي ما كان قبل كده من غير أي تغيير في زرار الإضافة بتاعه على أي موديول.
    const canWriteModule = !(['accommodation','accounting'].includes(state.user.role) && key==='subscriptions');
    const canAssignTrip = key==='subscriptions' && state.user.role==='accommodation';

    // فلترة الأعمدة: بنستبعد أي حقل اتفرض من forcedFilter (زي النوع جوه بوابة
    // المهتمين/المندوبين) عشان مايبانش فلتر لحاجة أصلًا متثبتة في هذا العرض.
    state.moduleFilters = state.moduleFilters || {};
    const filterStateKey = options.forcedFilter ? key+':'+Object.values(options.forcedFilter).join(',') : key;
    state.moduleFilters[filterStateKey] = state.moduleFilters[filterStateKey] || {};
    const activeFilters = state.moduleFilters[filterStateKey];
    const filterExclude = options.forcedFilter ? Object.keys(options.forcedFilter) : [];
    const filterFields = filterableFieldsFor(mod, filterExclude);
    const columnFilteredData = applyColumnFilters(data, activeFilters);

    const bindTableEvents = (container, visibleData)=>{
      if(canAssignTrip){ bindAccommodationAssignEvents(container, visibleData); return; }
      container.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click', ()=>{
        const row=visibleData.find(r=>String(r.id)===String(b.dataset.edit));
        if(prCanEditRow(key,row)) openForm(key,b.dataset.edit,options.forcedAddValues); else alert('ليس لديك صلاحية لتعديل هذه البيانات');
      }));
      container.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click', async ()=>{
        const row=visibleData.find(r=>String(r.id)===String(b.dataset.del));
        if(!prCanEditRow(key,row)){ alert('ليس لديك صلاحية لحذف هذه البيانات'); return; }
        if(!confirm('تأكيد الحذف؟')) return;
        await apiDelete(key,b.dataset.del);
        if(key==='subscriptions'){
          const guests = await getData('accom_guests');
          const linked = guests.find(g=>String(g.subscriptionId||'')===String(b.dataset.del));
          if(linked) await apiDelete('accom_guests', linked.id);
        }
        render();
      }));
    };

    const tableSectionHtml = (visibleData)=>{
      if(!data.length) return `<div class="empty-state"><div class="big">📭</div>لا توجد بيانات بعد — ابدأ بالإضافة</div>`;
      if(!visibleData.length) return `<div class="empty-state"><div class="big">🔍</div>لا توجد نتائج مطابقة للبحث/الفلتر</div>`;
      return `<div class="table-wrap"><table>
          <thead><tr>${mod.fields.map(f=>`<th>${esc(f.label)}</th>`).join('')}<th></th></tr></thead>
          <tbody>${visibleData.map(row=> canAssignTrip? renderAccommodationAssignRow(mod,row,linkMaps) : renderRow(mod,row,linkMaps,canWriteModule)).join('')}</tbody>
        </table></div>`;
    };

    const hasFilterFields = filterFields.length>0;
    const filterBarHtml = hasFilterFields ? `
      <div class="analytics-filterbar" id="module-filterbar" style="margin-top:10px;${Object.values(activeFilters).some(v=>v)?'':'display:none;'}">
        ${filterFields.map(f=>{
          const opts = f.type==='select'? f.options : [...new Set(data.map(r=>r[f.key]).filter(Boolean))];
          const cur = activeFilters[f.key]||'';
          return `<select class="analytics-filter" data-filterfield="${f.key}">
            <option value="">${esc(f.label)}: الكل</option>
            ${opts.map(o=>`<option value="${esc(o)}" ${o===cur?'selected':''}>${esc(o)}</option>`).join('')}
          </select>`;
        }).join('')}
        <button class="btn-secondary" id="clear-module-filters" style="width:auto;padding:8px 14px;">✖ مسح الفلاتر</button>
      </div>` : '';

    page.innerHTML = `
      ${options.crumbs? crumbsBar(options.crumbs) : ''}
      <div class="page-head">
        <h2>${mod.icon} ${esc(mod.title)}</h2>
        ${canWriteModule ? `<button class="btn-primary btn-gold" id="add-btn" style="width:auto;padding:10px 20px;">+ إضافة</button>` : ''}
      </div>
      ${isPRUser() && state.user.role!=='pr_manager' ? `<div class="assumption-note">البيانات المعروضة هنا خاصة بنطاق صلاحيتك. لا يتم عرض بيانات أعضاء العلاقات العامة الآخرين.</div>`:''}
      ${!canWriteModule && !canAssignTrip ? `<div class="assumption-note">عرض فقط: ليس لديك صلاحية إضافة أو تعديل أو حذف بيانات هنا.</div>`:''}
      ${canAssignTrip ? `<div class="assumption-note">تقدر هنا تحدد الرحلة والفندق والغرفة لكل مشترك فقط — باقي بيانات المشترك للعرض.</div>`:''}
      ${data.length? `<div class="card" style="padding:14px 20px;margin-bottom:14px;">
        <div style="display:flex;gap:10px;align-items:center;">
          <input type="text" id="module-search-input" placeholder="🔍 ابحث في ${esc(mod.title)}..." value="${esc(searchTerm)}"
            style="flex:1;padding:10px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:14px;background:var(--sand-50);"/>
          ${hasFilterFields? `<button class="icon-btn" id="module-filter-toggle" style="background:var(--sand-100);white-space:nowrap;">🔽 فلتر</button>`:''}
        </div>
        ${filterBarHtml}
      </div>` : ''}
      <div class="card"><div id="module-table-wrap">${tableSectionHtml(filterModuleRows(mod, columnFilteredData, linkMaps, searchTerm))}</div></div>`;

    if(options.crumbs && options.crumbHandlers) bindCrumbs(page, options.crumbHandlers);

    if(canWriteModule){
      document.getElementById('add-btn').addEventListener('click', ()=> key==='employees' ? openEmployeeAccountForm() : openForm(key, null, options.forcedAddValues));
    }

    const filterToggleBtn = document.getElementById('module-filter-toggle');
    if(filterToggleBtn){
      filterToggleBtn.addEventListener('click', ()=>{
        const bar = document.getElementById('module-filterbar');
        if(bar) bar.style.display = bar.style.display==='none' ? '' : 'none';
      });
    }
    page.querySelectorAll('#module-filterbar .analytics-filter').forEach(sel=>{
      sel.addEventListener('change', ()=>{
        activeFilters[sel.dataset.filterfield] = sel.value;
        render();
      });
    });
    const clearFiltersBtn = document.getElementById('clear-module-filters');
    if(clearFiltersBtn) clearFiltersBtn.addEventListener('click', ()=>{ state.moduleFilters[filterStateKey] = {}; render(); });

    const searchIndex = columnFilteredData.map(row=>({row, text: rowSearchText(mod, row, linkMaps)}));
    const filterBySearchIndex = (term)=>{
      term = (term||'').trim().toLowerCase();
      return term ? searchIndex.filter(x=>x.text.includes(term)).map(x=>x.row) : columnFilteredData;
    };

    let currentVisible = filterBySearchIndex(searchTerm);
    bindTableEvents(document.getElementById('module-table-wrap'), currentVisible);

    const searchInput = document.getElementById('module-search-input');
    if(searchInput){
      let debounceTimer;
      searchInput.addEventListener('input', ()=>{
        state.moduleSearch[key] = searchInput.value;
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(()=>{
          currentVisible = filterBySearchIndex(searchInput.value);
          const wrap = document.getElementById('module-table-wrap');
          wrap.innerHTML = tableSectionHtml(currentVisible);
          bindTableEvents(wrap, currentVisible);
        }, 180);
      });
    }
  }

  function rowSearchText(mod, row, linkMaps){
    const parts = mod.fields.map(f=>{
      const v = row[f.key];
      if(f.key==='leadId'){
        const code = linkMaps && linkMaps.__leadCodes && linkMaps.__leadCodes[v];
        return code || v || '';
      }
      if(f.type==='linkSelect'){
        const label = linkMaps && linkMaps[f.key] && linkMaps[f.key][v];
        return label || v || '';
      }
      if(f.type==='image') return '';
      return v==null? '' : String(v);
    });
    return parts.join(' ').toLowerCase();
  }
  function filterModuleRows(mod, data, linkMaps, searchTerm){
    const term = (searchTerm||'').trim().toLowerCase();
    if(!term) return data;
    return data.filter(r=> rowSearchText(mod, r, linkMaps).includes(term));
  }

  function fieldDisplay(f, val, linkMaps, row){
    if(f.key==='leadId'){
      const leadId = String(row?.leadId || val || '').trim();
      if(!leadId) return '';
      const code = linkMaps && linkMaps.__leadCodes && linkMaps.__leadCodes[leadId];
      if(code) return esc(code);

      const nationalId = String(row?.nationalId || '').replace(/\D/g,'');
      const phone = String(row?.phone || '').replace(/\D/g,'');
      const nationalPart = nationalId.slice(0,4);
      const phonePart = phone.slice(-2);
      const parts = [leadId];
      if(nationalPart) parts.push(nationalPart);
      if(phonePart) parts.push(phonePart);
      return esc(parts.join(' - '));
    }

    if(f.type==='image'){
      return val? `<img class="row-photo" src="${val}"/>` : `<div class="row-photo"></div>`;
    }
    if(f.type==='linkSelect'){
      if(!val) return '';
      const label = linkMaps && linkMaps[f.key] && linkMaps[f.key][val];
      return esc(label || val);
    }
    if(f.key==='status' || f.key==='flightStatus' || f.key==='paymentStatus'){
      const map = {'تم التواصل':'blue','تم تحديد معاد':'gold','تم الرفض':'red','تحت التفاوض':'gold',
        'لم يتم التوصل لأي شيء':'gray','لم تتم الزيارة':'gray','مكتمل':'green','جاري السداد':'gold','متأخر':'red',
        'تم الحجز':'green','لم يُحجز':'gray','جديد':'blue','تحويل لحجز':'green'};
      const cls = map[val] || 'gray';
      return val? `<span class="badge ${cls}">${esc(val)}</span>` : '';
    }
    return esc(val);
  }

  function renderRow(mod, row, linkMaps, canWrite){
    if(canWrite===undefined) canWrite=true; // القيمة الافتراضية بتحافظ على السلوك القديم لأي نداء تاني للدالة دي
    return `<tr>${mod.fields.map(f=>`<td>${fieldDisplay(f,row[f.key],linkMaps,row)}</td>`).join('')}
      <td style="white-space:nowrap;">
        ${canWrite ? `<button class="icon-btn" data-edit="${row.id}">✏️</button>
        <button class="icon-btn del" data-del="${row.id}">🗑️</button>` : ''}
      </td></tr>`;
  }
